<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Toast 提示</title>
  <script src="https://cdn.jsdelivr.net/gh/kirakiray/ofa.js@4.7.0/dist/ofa.mjs" type="module"></script>
  <script src="https://cdn.jsdelivr.net/gh/kirakiray/ofa.js@4.7.0/libs/scsr/dist/scsr.min.mjs" type="module"></script>
  <link rel="icon" href="../../img/logo.svg" />
  <link rel="stylesheet" href="../../css/palette.css" pui-colors />
  <link rel="stylesheet" href="../../css/theme.css" />
  <link rel="stylesheet" href="../../css/github-markdown.css" />
  <link rel="stylesheet" href="../../css/hljs.css" />
  <style>
    html,
    body {
      height: 100%;
      padding: 0;
      margin: 0;
      overflow: hidden;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        Segoe UI,
        Microsoft Yahei,
        Helvetica,
        Arial,
        sans-serif,
        Apple Color Emoji,
        Segoe UI Emoji;
    }

    o-app {
      height: 100%;
    }

    @keyframes fadein {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    o-app {
      animation: fadein 0.1s ease-in-out;
    }
  </style>
  <script type="module" src="../../js/util.js"></script>
  <!--google analytics-->
</head>

<body>
  <o-app src="../../js/app-config.js">
    <template page>
      <link rel="stylesheet" href="../../css/github-markdown.css" />
      <link rel="stylesheet" href="../../css/hljs.css" />
      <l-m src="../../comps/center-block.html"></l-m>
      <l-m src="../../comps/article-code.html"></l-m>
      <l-m src="https://playground.ofajs.com/comps/o-playground/o-playground.html"></l-m>
      <style>
        :host {
          display: block;
          height: 100%;
          box-sizing: border-box;
          overflow: auto;
        }
      </style>
      <link rel="stylesheet" href="../../css/page.css" />
      <article class="markdown-body">
        <h1>Toast 提示</h1>
        <p>Toast 用于显示简短的提示消息，自动消失。适用于操作反馈、状态提示等场景。</p>
        <h2>引入</h2>
        <pre><code class="hljs language-javascript"><span class="hljs-keyword">import</span> toast <span class="hljs-keyword">from</span> <span class="hljs-string">&#x27;https://punch-ui-v2.pages.dev/packages/util/toast.js&#x27;</span>;</code></pre>
        <h2>基本用法</h2>
        <o-playground name="Toast 基本用法" style="--editor-height: 400px">
          <code path="demo.html" preview active>
    <template>
      <link rel="stylesheet" href="https://punch-ui-v2.pages.dev/packages/css/pui-global.css" />
      <l-m src="https://punch-ui-v2.pages.dev/packages/button/button.html"></l-m>
      <script type="module">
        import toast from 'https://punch-ui-v2.pages.dev/packages/util/toast.js';
        export default async () => {
          return {
            proto: {
              showToast() {
                toast('操作成功！');
              }
            }
          };
        };
      </script>
      <div style="padding: 20px; text-align: center;">
        <p-button color="primary" on:click="showToast">显示 Toast</p-button>
      </div>
    </template>
  </code>
        </o-playground>
        <h2>带配置选项</h2>
        <o-playground name="Toast 配置选项" style="--editor-height: 500px">
          <code path="demo.html" preview active>
    <template>
      <link rel="stylesheet" href="https://punch-ui-v2.pages.dev/packages/css/pui-global.css" />
      <l-m src="https://punch-ui-v2.pages.dev/packages/button/button.html"></l-m>
      <script type="module">
        import toast from 'https://punch-ui-v2.pages.dev/packages/util/toast.js';
        export default async () => {
          return {
            proto: {
              showSuccessToast() {
                toast({
                  message: '保存成功！',
                  duration: 3000,
                  color: 'success'
                });
              },
              showErrorToast() {
                toast({
                  message: '操作失败！',
                  duration: 3000,
                  color: 'error'
                });
              }
            }
          };
        };
      </script>
      <div style="padding: 20px; text-align: center;">
        <p-button color="success" on:click="showSuccessToast">成功提示</p-button>
        <p-button color="error" on:click="showErrorToast" style="margin-left: 10px;">错误提示</p-button>
      </div>
    </template>
  </code>
        </o-playground>
        <h2>API</h2>
        <h3>参数</h3>
        <table>
          <thead>
            <tr>
              <th>参数</th>
              <th>类型</th>
              <th>默认值</th>
              <th>说明</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>message</td>
              <td><code>string</code></td>
              <td>-</td>
              <td>提示消息内容</td>
            </tr>
            <tr>
              <td>duration</td>
              <td><code>number</code></td>
              <td><code>3000</code></td>
              <td>显示时长（毫秒），设为 0 则不自动关闭</td>
            </tr>
            <tr>
              <td>color</td>
              <td><code>string</code></td>
              <td><code>&#39;primary&#39;</code></td>
              <td>提示颜色：<code>primary</code>, <code>success</code>, <code>error</code>, <code>neutral</code></td>
            </tr>
          </tbody>
        </table>
        <h3>返回值</h3>
        <p>返回一个对象，包含：</p>
        <ul>
          <li><code>close</code> - 关闭提示的方法</li>
          <li><code>el</code> - 提示元素引用</li>
        </ul>
        <h3>示例</h3>
        <pre><code class="hljs language-javascript"><span class="hljs-comment">// 基本用法</span>
<span class="hljs-title function_">toast</span>(<span class="hljs-string">&#x27;操作成功&#x27;</span>);

<span class="hljs-comment">// 带配置</span>
<span class="hljs-title function_">toast</span>({
  <span class="hljs-attr">message</span>: <span class="hljs-string">&#x27;文件上传成功&#x27;</span>,
  <span class="hljs-attr">duration</span>: <span class="hljs-number">5000</span>,
  <span class="hljs-attr">color</span>: <span class="hljs-string">&#x27;success&#x27;</span>
});

<span class="hljs-comment">// 手动关闭</span>
<span class="hljs-keyword">const</span> toastInstance = <span class="hljs-title function_">toast</span>(<span class="hljs-string">&#x27;正在处理...&#x27;</span>);
<span class="hljs-built_in">setTimeout</span>(<span class="hljs-function">() =&gt;</span> {
  toastInstance.<span class="hljs-title function_">close</span>();
}, <span class="hljs-number">2000</span>);</code></pre>
      </article>
      <div class="footer"></div>
      <script>
        export const parent = "../../layout.html";
        export default async ({
          load,
          query
        }) => {
          const {
            init,
            revoke
          } = await load("../../js/init.js");
          return {
            data: {},
            attached() {
              init(this, query);
              setTimeout(() => {
                this.style.transform = "";
              }, 300);
            },
            detached() {
              revoke(this);
            },
          };
        };
      </script>
    </template>
  </o-app>
  <o-root-provider name="pui" theme="dark"></o-root-provider>
</body>

</html>
