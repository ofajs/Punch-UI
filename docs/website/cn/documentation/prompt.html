<body>
  <o-app src="../../js/app-config.js">
    <template page>

      <article class="markdown-body">
        <h1>Prompt 输入框</h1>
        <p>Prompt 用于显示一个输入对话框，让用户输入文本。适用于需要用户输入信息的场景。</p>
        <h2>引入</h2>
        <pre><code class="hljs language-javascript"><span class="hljs-keyword">import</span> prompt <span class="hljs-keyword">from</span> <span class="hljs-string">&#x27;https://punch-ui-v2.pages.dev/packages/util/prompt.js&#x27;</span>;</code></pre>
        <h2>基本用法</h2>
        <o-playground name="Prompt 基本用法" style="--editor-height: 400px">
          <code path="demo.html" preview active>
    <template>
      <link rel="stylesheet" href="https://punch-ui-v2.pages.dev/packages/css/pui-global.css" />
      <l-m src="https://punch-ui-v2.pages.dev/packages/button/button.html"></l-m>
      <script type="module">
        import prompt from 'https://punch-ui-v2.pages.dev/packages/util/prompt.js';
        import toast from 'https://punch-ui-v2.pages.dev/packages/util/toast.js';
        export default async () => {
          return {
            proto: {
              async showPrompt() {
                const result = await prompt('请输入您的名字：');
                if (result !== null) {
                  toast(`你好，${result}！`);
                }
              }
            }
          };
        };
      </script>
      <div style="padding: 20px; text-align: center;">
        <p-button color="primary" on:click="showPrompt">输入名字</p-button>
      </div>
    </template>
  </code>
        </o-playground>
        <h2>API</h2>
        <h3>参数</h3>
        <table>
          <thead>
            <tr>
              <th>参数</th>
              <th>类型</th>
              <th>默认值</th>
              <th>说明</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>title</td>
              <td><code>string</code></td>
              <td><code>&#39;提示&#39;</code></td>
              <td>对话框标题</td>
            </tr>
            <tr>
              <td>message</td>
              <td><code>string</code></td>
              <td>-</td>
              <td>提示消息内容</td>
            </tr>
            <tr>
              <td>defaultValue</td>
              <td><code>string</code></td>
              <td><code>&#39;&#39;</code></td>
              <td>输入框默认值</td>
            </tr>
            <tr>
              <td>ok</td>
              <td><code>string</code></td>
              <td><code>&#39;确定&#39;</code></td>
              <td>确认按钮文本</td>
            </tr>
            <tr>
              <td>cancel</td>
              <td><code>string</code></td>
              <td><code>&#39;取消&#39;</code></td>
              <td>取消按钮文本</td>
            </tr>
          </tbody>
        </table>
        <h3>返回值</h3>
        <p>返回一个 Promise：</p>
        <ul>
          <li>resolve 为用户输入的文本（字符串）</li>
          <li>resolve 为 <code>null</code> 表示用户点击了取消</li>
        </ul>
        <h3>示例</h3>
        <pre><code class="hljs language-javascript"><span class="hljs-comment">// 基本用法</span>
<span class="hljs-keyword">const</span> name = <span class="hljs-keyword">await</span> <span class="hljs-title function_">prompt</span>(<span class="hljs-string">&#x27;请输入您的名字：&#x27;</span>);
<span class="hljs-keyword">if</span> (name !== <span class="hljs-literal">null</span>) {
  <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&#x27;用户输入：&#x27;</span>, name);
}

<span class="hljs-comment">// 带配置</span>
<span class="hljs-keyword">const</span> result = <span class="hljs-keyword">await</span> <span class="hljs-title function_">prompt</span>({
  <span class="hljs-attr">title</span>: <span class="hljs-string">&#x27;修改用户名&#x27;</span>,
  <span class="hljs-attr">message</span>: <span class="hljs-string">&#x27;请输入新的用户名：&#x27;</span>,
  <span class="hljs-attr">defaultValue</span>: <span class="hljs-string">&#x27;当前用户名&#x27;</span>,
  <span class="hljs-attr">ok</span>: <span class="hljs-string">&#x27;保存&#x27;</span>,
  <span class="hljs-attr">cancel</span>: <span class="hljs-string">&#x27;取消&#x27;</span>
});</code></pre>
      </article>
      <div class="footer"></div>
      <script>
        export const parent = "../../layout.html";
        export default async ({
          load,
          query
        }) => {
          const {
            init,
            revoke
          } = await load("../../js/init.js");
          return {
            data: {},
            attached() {
              init(this, query);
              setTimeout(() => {
                this.style.transform = "";
              }, 300);
            },
            detached() {
              revoke(this);
            },
          };
        };
      </script>
