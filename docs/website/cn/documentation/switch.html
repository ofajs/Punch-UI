<body>
  <o-app src="../../js/app-config.js">
    <template page>
      <link rel="stylesheet" href="../../css/github-markdown.css" />
      <link rel="stylesheet" href="../../css/hljs.css" />
      <l-m src="../../comps/center-block.html"></l-m>
      <l-m src="../../comps/article-code.html"></l-m>
      <l-m src="https://playground.ofajs.com/comps/o-playground/o-playground.html"></l-m>
      <style>
        :host {

          width: 100%;
          height: 100%;
          box-sizing: border-box;
          overflow: auto;
        }
      </style>
      <link rel="stylesheet" href="../../css/page.css" />
      <article class="markdown-body">
        <h1>Switch 开关</h1>
        <p>开关组件用于在两种状态之间切换，通过 <code>value</code> 反映当前状态。</p>
        <h2>引入组件</h2>
        <pre><code class="hljs language-html"><span class="hljs-tag">&lt;<span class="hljs-name">l-m</span> <span class="hljs-attr">src</span>=<span class="hljs-string">&quot;https://punch-ui-v2.pages.dev/packages/switch/switch.html&quot;</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">l-m</span>&gt;</span></code></pre>
        <h2>基本用法</h2>
        <p>开关组件不再使用 <code>checked</code> 属性，而是统一通过 <code>value</code>（配合 <code>checked-value</code> / <code>unchecked-value</code>）表达状态。使用 <code>default-value</code> 设置初始值。</p>
        <o-playground name="Switch 基本用法" style="--editor-height: 300px">
          <code path="demo.html" preview active>
    <template>
      <link rel="stylesheet" href="https://punch-ui-v2.pages.dev/packages/css/pui-global.css" />
      <l-m src="https://punch-ui-v2.pages.dev/packages/switch/switch.html"></l-m>
      <div style="padding: 20px;">
        <p-switch>默认开关</p-switch>
        <p-switch default-value="on">已选中</p-switch>
      </div>
    </template>
  </code>
        </o-playground>
        <h2>尺寸</h2>
        <p>通过 <code>size</code> 属性设置开关尺寸：</p>
        <o-playground name="Switch 尺寸" style="--editor-height: 350px">
          <code path="demo.html" preview active>
    <template>
      <link rel="stylesheet" href="https://punch-ui-v2.pages.dev/packages/css/pui-global.css" />
      <l-m src="https://punch-ui-v2.pages.dev/packages/switch/switch.html"></l-m>
      <div style="padding: 20px;">
        <p-switch size="xs">XS</p-switch>
        <p-switch size="s">Small</p-switch>
        <p-switch>Medium</p-switch>
        <p-switch size="l">Large</p-switch>
        <p-switch size="xl">XL</p-switch>
      </div>
    </template>
  </code>
        </o-playground>
        <h2>颜色</h2>
        <p>通过 <code>color</code> 属性设置开关颜色：</p>
        <o-playground name="Switch 颜色" style="--editor-height: 350px">
          <code path="demo.html" preview active>
    <template>
      <link rel="stylesheet" href="https://punch-ui-v2.pages.dev/packages/css/pui-global.css" />
      <l-m src="https://punch-ui-v2.pages.dev/packages/switch/switch.html"></l-m>
      <div style="padding: 20px;">
        <p-switch color="primary" default-value="on">Primary</p-switch>
        <p-switch color="error" default-value="on">Error</p-switch>
        <p-switch color="success" default-value="on">Success</p-switch>
      </div>
    </template>
  </code>
        </o-playground>
        <h2>状态</h2>
        <o-playground name="Switch 状态" style="--editor-height: 350px">
          <code path="demo.html" preview active>
    <template>
      <link rel="stylesheet" href="https://punch-ui-v2.pages.dev/packages/css/pui-global.css" />
      <l-m src="https://punch-ui-v2.pages.dev/packages/switch/switch.html"></l-m>
      <div style="padding: 20px;">
        <p-switch default-value="on">选中状态</p-switch>
        <p-switch>未选中状态</p-switch>
        <p-switch disabled>禁用状态</p-switch>
      </div>
    </template>
  </code>
        </o-playground>
        <h2>表单集成</h2>
        <h3>自定义值</h3>
        <p>使用 <code>checked-value</code> 和 <code>unchecked-value</code> 属性自定义选中/未选中的值：</p>
        <o-playground name="自定义值的开关" style="--editor-height: 350px">
          <code path="demo.html" preview active>
    <template>
      <link rel="stylesheet" href="https://punch-ui-v2.pages.dev/packages/css/pui-global.css" />
      <l-m src="https://punch-ui-v2.pages.dev/packages/switch/switch.html"></l-m>
      <div style="padding: 20px;">
        <p-switch 
          name="status" 
          checked-value="enabled" 
          unchecked-value="disabled"
          default-value="enabled"
        >
          状态开关
        </p-switch>
      </div>
    </template>
  </code>
        </o-playground>
        <h3>默认值</h3>
        <p>使用 <code>default-value</code> 属性设置初始值（初始选中状态的唯一入口）：</p>
        <o-playground name="默认值" style="--editor-height: 350px">
          <code path="demo.html" preview active>
    <template>
      <link rel="stylesheet" href="https://punch-ui-v2.pages.dev/packages/css/pui-global.css" />
      <l-m src="https://punch-ui-v2.pages.dev/packages/switch/switch.html"></l-m>
      <div style="padding: 20px;">
        <p-switch 
          name="theme" 
          checked-value="dark" 
          unchecked-value="light"
          default-value="dark"
        >
          深色模式
        </p-switch>
      </div>
    </template>
  </code>
        </o-playground>
        <h2>交互功能</h2>
        <h3>自动聚焦</h3>
        <p>使用 <code>autofocus</code> 属性使开关在页面加载时自动获得焦点：</p>
        <o-playground name="自动聚焦" style="--editor-height: 300px">
          <code path="demo.html" preview active>
    <template>
      <link rel="stylesheet" href="https://punch-ui-v2.pages.dev/packages/css/pui-global.css" />
      <l-m src="https://punch-ui-v2.pages.dev/packages/switch/switch.html"></l-m>
      <div style="padding: 20px;">
        <p-switch autofocus>自动聚焦</p-switch>
      </div>
    </template>
  </code>
        </o-playground>
        <h3>键盘操作</h3>
        <p>开关支持键盘操作：</p>
        <ul>
          <li><strong>空格键</strong> - 切换开关状态</li>
          <li><strong>回车键</strong> - 切换开关状态</li>
        </ul>
        <o-playground name="键盘操作" style="--editor-height: 300px">
          <code path="demo.html" preview active>
    <template>
      <link rel="stylesheet" href="https://punch-ui-v2.pages.dev/packages/css/pui-global.css" />
      <l-m src="https://punch-ui-v2.pages.dev/packages/switch/switch.html"></l-m>
      <div style="padding: 20px;">
        <p-switch>使用键盘操作</p-switch>
      </div>
    </template>
  </code>
        </o-playground>
        <h3>编程控制</h3>
        <p>通过 JavaScript 修改 <code>value</code> 控制开关状态：</p>
        <o-playground name="编程控制" style="--editor-height: 400px">
          <code path="demo.html" preview active>
    <template>
      <link rel="stylesheet" href="https://punch-ui-v2.pages.dev/packages/css/pui-global.css" />
      <l-m src="https://punch-ui-v2.pages.dev/packages/button/button.html"></l-m>
      <l-m src="https://punch-ui-v2.pages.dev/packages/switch/switch.html"></l-m>
      <div style="padding: 20px;">
        <p-switch id="my-switch">编程控制</p-switch>
        <p-button style="margin-top: 16px;" on:click="const sw = this.$('#my-switch'); sw.value = sw.value === 'on' ? 'off' : 'on';">切换状态</p-button>
      </div>
    </template>
  </code>
        </o-playground>
        <h2>变体样式</h2>
        <p>使用 <code>variant</code> 属性设置不同的样式：</p>
        <o-playground name="变体样式" style="--editor-height: 350px">
          <code path="demo.html" preview active>
    <template>
      <link rel="stylesheet" href="https://punch-ui-v2.pages.dev/packages/css/pui-global.css" />
      <l-m src="https://punch-ui-v2.pages.dev/packages/switch/switch.html"></l-m>
      <div style="padding: 20px;">
        <p-switch variant="filled" default-value="on">Filled</p-switch>
        <p-switch variant="outlined" default-value="on">Outlined</p-switch>
        <p-switch variant="text" default-value="on">Text</p-switch>
      </div>
    </template>
  </code>
        </o-playground>
        <h2>方法</h2>
        <p>开关组件提供以下方法：</p>
        <ul>
          <li><code>focus()</code> - 使开关获得焦点</li>
        </ul>
        <o-playground name="方法" style="--editor-height: 400px">
          <code path="demo.html" preview active>
    <template>
      <link rel="stylesheet" href="https://punch-ui-v2.pages.dev/packages/css/pui-global.css" />
      <l-m src="https://punch-ui-v2.pages.dev/packages/button/button.html"></l-m>
      <l-m src="https://punch-ui-v2.pages.dev/packages/switch/switch.html"></l-m>
      <div style="padding: 20px;">
        <p-switch id="focus-switch">聚焦开关</p-switch>
        <p-button style="margin-top: 16px;" on:click="this.$('#focus-switch').focus()">聚焦</p-button>
      </div>
    </template>
  </code>
        </o-playground>
        <h2>动画效果</h2>
        <p>开关组件包含以下动画效果：</p>
        <ul>
          <li><strong>滑块移动</strong> - 平滑的滑动动画</li>
          <li><strong>勾选标记</strong> - 选中时显示勾选动画</li>
          <li><strong>边框填充</strong> - 选中时边框填充动画</li>
        </ul>
        <o-playground name="动画效果" style="--editor-height: 300px">
          <code path="demo.html" preview active>
    <template>
      <link rel="stylesheet" href="https://punch-ui-v2.pages.dev/packages/css/pui-global.css" />
      <l-m src="https://punch-ui-v2.pages.dev/packages/switch/switch.html"></l-m>
      <div style="padding: 20px;">
        <p-switch default-value="on">动画效果</p-switch>
      </div>
    </template>
  </code>
        </o-playground>
        <h2>获取值</h2>
        <h3>通过 value 属性获取</h3>
        <p>使用 <code>value</code> 属性获取开关当前值（等于 <code>checked-value</code> 或 <code>unchecked-value</code>）：</p>
        <o-playground name="获取值" style="--editor-height: 400px">
          <code path="demo.html" preview active>
    <template>
      <link rel="stylesheet" href="https://punch-ui-v2.pages.dev/packages/css/pui-global.css" />
      <l-m src="https://punch-ui-v2.pages.dev/packages/button/button.html"></l-m>
      <l-m src="https://punch-ui-v2.pages.dev/packages/switch/switch.html"></l-m>
      <div style="padding: 20px;">
        <p-switch id="theme-switch">深色模式</p-switch>
        <p-button style="margin-top: 16px;" id="get-value-btn">获取状态</p-button>
        <p style="margin-top: 16px;">当前状态: <span id="status-display"></span></p>
      </div>
      <script>
        $('#get-value-btn').on('click', () => {
          const value = $('#theme-switch').value;
          $('#status-display').text = value === 'on' ? '已开启' : '已关闭';
        });
      </script>
    </template>
  </code>
        </o-playground>
        <h3>获取自定义值</h3>
        <p>当设置了 <code>checked-value</code> 和 <code>unchecked-value</code> 时，通过 <code>value</code> 属性获取当前值：</p>
        <o-playground name="获取自定义值" style="--editor-height: 400px">
          <code path="demo.html" preview active>
    <template>
      <link rel="stylesheet" href="https://punch-ui-v2.pages.dev/packages/css/pui-global.css" />
      <l-m src="https://punch-ui-v2.pages.dev/packages/button/button.html"></l-m>
      <l-m src="https://punch-ui-v2.pages.dev/packages/switch/switch.html"></l-m>
      <div style="padding: 20px;">
        <p-switch 
          id="status-switch"
          checked-value="enabled" 
          unchecked-value="disabled"
          default-value="enabled"
        >
          状态开关
        </p-switch>
        <p-button style="margin-top: 16px;" id="get-custom-btn">获取值</p-button>
        <p style="margin-top: 16px;">当前值: <span id="custom-value-display"></span></p>
      </div>
      <script>
        $('#get-custom-btn').on('click', () => {
          const value = $('#status-switch').value;
          $('#custom-value-display').text = value;
        });
      </script>
    </template>
  </code>
        </o-playground>
        <h3>监听变化事件</h3>
        <p>通过监听 <code>change</code> 事件实时获取开关状态：</p>
        <o-playground name="监听变化事件" style="--editor-height: 400px">
          <code path="demo.html" preview active>
    <template>
      <link rel="stylesheet" href="https://punch-ui-v2.pages.dev/packages/css/pui-global.css" />
      <l-m src="https://punch-ui-v2.pages.dev/packages/switch/switch.html"></l-m>
      <div style="padding: 20px;">
        <p-switch id="realtime-switch">实时监听</p-switch>
        <p style="margin-top: 16px;">当前状态: <span id="realtime-display"></span></p>
      </div>
      <script>
        $('#realtime-switch').on('change', () => {
          const value = $('#realtime-switch').value;
          $('#realtime-display').text = value === 'on' ? '已开启' : '已关闭';
        });
      </script>
    </template>
  </code>
        </o-playground>
        <h3>组件或页面模块中双向绑定</h3>
        <p>使用 ofa.js 的数据绑定功能：</p>
        <o-playground name="获取值" style="--editor-height: 400px">
          <code path="demo.html" active>
    <template page>
      <link rel="stylesheet" href="https://punch-ui-v2.pages.dev/packages/css/pui-global.css" />
      <l-m src="https://punch-ui-v2.pages.dev/packages/switch/switch.html"></l-m>
      <div style="padding: 20px;">
        <p-switch 
          sync:value="status"
          checked-value="on"
          unchecked-value="off"
        >
          深色模式
        </p-switch>
        <p style="margin-top: 16px;">当前状态: {{ status }}</p>
      </div>
      <script>
        export default {
          data: {
            status: 'on'
          }
        };
      </script>
    </template>
  </code>
        </o-playground>
        <p>在组件或页面模块中使用双向绑定时，<strong>只需绑定 <code>value</code> 属性</strong>，配合 <code>checked-value</code> 和 <code>unchecked-value</code> 使用即可。</p>
        <h2>无障碍支持</h2>
        <p>开关组件提供以下无障碍支持：</p>
        <ul>
          <li>支持键盘导航和操作</li>
          <li>提供焦点状态指示</li>
          <li>支持屏幕阅读器</li>
        </ul>
        <o-playground name="无障碍支持" style="--editor-height: 300px">
          <code path="demo.html" preview active>
    <template>
      <link rel="stylesheet" href="https://punch-ui-v2.pages.dev/packages/css/pui-global.css" />
      <l-m src="https://punch-ui-v2.pages.dev/packages/switch/switch.html"></l-m>
      <div style="padding: 20px;">
        <p-switch>无障碍开关</p-switch>
      </div>
    </template>
  </code>
        </o-playground>
        <h2>API</h2>
        <h3>属性</h3>
        <table>
          <thead>
            <tr>
              <th>属性</th>
              <th>说明</th>
              <th>类型</th>
              <th>默认值</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td><code>value</code></td>
              <td>当前值（等于 <code>checked-value</code> 或 <code>unchecked-value</code>）</td>
              <td><code>string</code></td>
              <td>-</td>
            </tr>
            <tr>
              <td><code>size</code></td>
              <td>开关尺寸</td>
              <td><code>xs</code> | <code>s</code> | <code>l</code> | <code>xl</code></td>
              <td>-</td>
            </tr>
            <tr>
              <td><code>color</code></td>
              <td>开关颜色</td>
              <td><code>primary</code> | <code>error</code> | <code>success</code></td>
              <td><code>primary</code></td>
            </tr>
            <tr>
              <td><code>disabled</code></td>
              <td>是否禁用</td>
              <td><code>boolean</code></td>
              <td><code>false</code></td>
            </tr>
            <tr>
              <td><code>name</code></td>
              <td>表单名称</td>
              <td><code>string</code></td>
              <td>-</td>
            </tr>
            <tr>
              <td><code>checked-value</code></td>
              <td>选中时的值</td>
              <td><code>string</code></td>
              <td><code>on</code></td>
            </tr>
            <tr>
              <td><code>unchecked-value</code></td>
              <td>未选中时的值</td>
              <td><code>string</code></td>
              <td><code>off</code></td>
            </tr>
            <tr>
              <td><code>default-value</code></td>
              <td>默认值</td>
              <td><code>string</code></td>
              <td>-</td>
            </tr>
          </tbody>
        </table>
        <h3>事件</h3>
        <table>
          <thead>
            <tr>
              <th>事件名</th>
              <th>说明</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td><code>change</code></td>
              <td>开关状态改变时触发</td>
            </tr>
          </tbody>
        </table>
        <h3>方法</h3>
        <table>
          <thead>
            <tr>
              <th>方法名</th>
              <th>说明</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td><code>focus()</code></td>
              <td>使开关获得焦点</td>
            </tr>
          </tbody>
        </table>
      </article>
      <div class="footer"></div>
      <script>
        export const parent = "../../layout.html";
        export default async ({
          load,
          query
        }) => {
          const {
            init,
            revoke
          } = await load("../../js/init.js");
          return {
            data: {},
            attached() {
              init(this, query);
              setTimeout(() => {
                this.style.transform = "";
              }, 300);
            },
            detached() {
              revoke(this);
            },
          };
        };
      </script>
    </template>
  </o-app>
  <o-root-provider name="pui" theme="dark"></o-root-provider>
</body>

</html>
