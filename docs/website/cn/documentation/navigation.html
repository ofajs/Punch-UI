        <h1>Navigation 导航</h1>
        <p>导航组件包提供了导航栏、导航项和导航布局组件，用于构建响应式的应用导航系统。</p>
        <h2>引入组件</h2>
        <pre><code class="hljs language-html"><span class="hljs-tag">&lt;<span class="hljs-name">l-m</span> <span class="hljs-attr">src</span>=<span class="hljs-string">&quot;https://punch-ui-v2.pages.dev/packages/navigation/nav-bar.html&quot;</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">l-m</span>&gt;</span></code></pre>

        <o-playground name="Navigation 基本用法" style="--editor-height: 400px">
          <code path="demo.html" preview active>
    <template>
      <link rel="stylesheet" href="https://punch-ui-v2.pages.dev/packages/css/pui-global.css" />
      <l-m src="https://punch-ui-v2.pages.dev/packages/navigation/nav-bar.html"></l-m>
      <l-m src="https://punch-ui-v2.pages.dev/packages/navigation/nav-item.html"></l-m>
      <div style="padding: 20px;">
        <p-nav-bar>
          <p-nav-item active>
            <span slot="icon">🏠</span>
            <span>首页</span>
          </p-nav-item>
          <p-nav-item>
            <span slot="icon">📑</span>
            <span>书签</span>

          <p-nav-item>
            <span slot="icon">👤</span>
            <span>关于</span>
          </p-nav-item>
        </p-nav-bar>
      </div>
    </template>
  </code>

        <h2>导航布局 (Nav Layout)</h2>
        <p><code>p-nav-layout</code> 是一个响应式导航布局组件，会根据容器宽度自动调整导航栏的样式和位置。</p>

        <pre><code class="hljs language-html"><span class="hljs-tag">&lt;<span class="hljs-name">l-m</span> <span class="hljs-attr">src</span>=<span class="hljs-string">&quot;https://punch-ui-v2.pages.dev/packages/navigation/nav-layout.html&quot;</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">l-m</span>&gt;</span></code></pre>

      <l-m src="https://punch-ui-v2.pages.dev/packages/navigation/nav-bar.html"></l-m>

      <script>
        export const parent = "../../layout.html";
        export default async ({
          load,
          query
        }) => {
          const {
            init,
            revoke
          } = await load("../../js/init.js");
          return {
            data: {},
            attached() {
              init(this, query);
              setTimeout(() => {
                this.style.transform = "";
              }, 300);
            },
            detached() {
              revoke(this);
            },
          };
        };
      </script>
