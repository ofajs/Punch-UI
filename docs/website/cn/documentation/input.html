      <article class="markdown-body">
        <h1>Input 输入框</h1>
        <p>输入框组件用于接收用户输入的文本信息，支持多种样式和尺寸。</p>
        <h2>引入组件</h2>
        <pre><code class="hljs language-html"><span class="hljs-tag">&lt;<span class="hljs-name">l-m</span> <span class="hljs-attr">src</span>=<span class="hljs-string">&quot;https://punch-ui-v2.pages.dev/packages/input/input.html&quot;</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">l-m</span>&gt;</span></code></pre>
        <h2>基本用法</h2>
        <o-playground name="Input 基本用法" style="--editor-height: 300px">
          <code path="demo.html" preview active>
    <template>
      <link rel="stylesheet" href="https://punch-ui-v2.pages.dev/packages/css/pui-global.css" />
      <l-m src="https://punch-ui-v2.pages.dev/packages/input/input.html"></l-m>
      <div style="padding: 20px; max-width: 400px;">
        <p-input placeholder="请输入内容"></p-input>
      </div>
    </template>
  </code>
        </o-playground>
        <h2>带标签</h2>
        <p>使用 <code>label</code> 插槽添加标签：</p>
        <o-playground name="带标签的输入框" style="--editor-height: 350px">
          <code path="demo.html" preview active>
    <template>
      <link rel="stylesheet" href="https://punch-ui-v2.pages.dev/packages/css/pui-global.css" />
      <l-m src="https://punch-ui-v2.pages.dev/packages/input/input.html"></l-m>
      <div style="padding: 20px; max-width: 400px;">
        <p-input>
          <span slot="label">用户名</span>
        </p-input>
      </div>
    </template>
  </code>
        </o-playground>
        <h2>尺寸</h2>
        <p>通过 <code>size</code> 属性设置输入框尺寸：</p>
        <o-playground name="Input 尺寸" style="--editor-height: 400px">
          <code path="demo.html" preview active>
    <template>
      <link rel="stylesheet" href="https://punch-ui-v2.pages.dev/packages/css/pui-global.css" />
      <l-m src="https://punch-ui-v2.pages.dev/packages/input/input.html"></l-m>
      <div style="padding: 20px; max-width: 400px;">
        <p-input size="xs">
          <span slot="label">Extra Small</span>
        </p-input>
        <p-input size="s">
          <span slot="label">Small</span>
        </p-input>
        <p-input>
          <span slot="label">Default</span>
        </p-input>
        <p-input size="l">
          <span slot="label">Large</span>
        </p-input>
        <p-input size="xl">
          <span slot="label">Extra Large</span>
        </p-input>
      </div>
    </template>
  </code>
        </o-playground>

        <h2>前缀和后缀</h2>
        <p>使用 <code>prefix</code> 和 <code>suffix</code> 插槽添加前缀或后缀：</p>
        <o-playground name="带前缀/后缀的输入框" style="--editor-height: 350px">
          <code path="demo.html" preview active>
    <template>
      <link rel="stylesheet" href="https://punch-ui-v2.pages.dev/packages/css/pui-global.css" />

      <div style="padding: 20px; max-width: 400px;">
        <p-input>
          <span slot="prefix">+86</span>
          <span slot="label">手机号</span>
        </p-input>
        <p-input style="margin-top: 16px;">
          <span slot="suffix">.com</span>
          <span slot="label">网站</span>
        </p-input>

  </code>

        <h2>变体样式</h2>
        <p>通过 <code>variant</code> 属性设置输入框样式：</p>

        </p-input>

        <h2>自动聚焦</h2>
        <p>使用 <code>autofocus</code> 属性使输入框在页面加载时自动获得焦点：</p>
        <o-playground name="自动聚焦" style="--editor-height: 300px">
          <code path="demo.html" preview active>
    <template>
      <link rel="stylesheet" href="https://punch-ui-v2.pages.dev/packages/css/pui-global.css" />
      <l-m src="https://punch-ui-v2.pages.dev/packages/input/input.html"></l-m>
      <div style="padding: 20px; max-width: 400px;">
        <p-input autofocus>
          <span slot="label">自动聚焦</span>
        </p-input>
      </div>
    </template>
  </code>
        </o-playground>
        <h2>悬浮标签</h2>
        <p>使用 <code>hang-label</code> 属性使标签始终悬浮在输入框上方：</p>
        <o-playground name="悬浮标签" style="--editor-height: 300px">
          <code path="demo.html" preview active>
    <template>
      <link rel="stylesheet" href="https://punch-ui-v2.pages.dev/packages/css/pui-global.css" />

      <div style="padding: 20px; max-width: 400px;">
        <p-input hang-label>

    </template>
  </code>
        </o-playground>
        <h2>默认值</h2>
        <p>使用 <code>default-value</code> 属性设置输入框的初始值：</p>
        <o-playground name="默认值" style="--editor-height: 300px">
          <code path="demo.html" preview active>
    <template>
      <link rel="stylesheet" href="https://punch-ui-v2.pages.dev/packages/css/pui-global.css" />

    <template>

        <h3>使用 CSS Part</h3>
        <p>使用 <code>::part()</code> 选择器自定义输入框内部样式：</p>
        <o-playground name="CSS Part 自定义" style="--editor-height: 350px">
          <code path="demo.html" preview active>
    <template>
      <link rel="stylesheet" href="https://punch-ui-v2.pages.dev/packages/css/pui-global.css" />

        <h2>编程控制</h2>

        <o-playground name="编程控制" style="--editor-height: 400px">
          <code path="demo.html" preview active>
    <template>
      <link rel="stylesheet" href="https://punch-ui-v2.pages.dev/packages/css/pui-global.css" />

        <h2>获取值</h2>
        <h3>通过 value 属性获取</h3>
        <p>使用 <code>value</code> 属性获取输入框的值：</p>
        <o-playground name="获取值" style="--editor-height: 400px">
          <code path="demo.html" preview active>
    <template page>
      <link rel="stylesheet" href="https://punch-ui-v2.pages.dev/packages/css/pui-global.css" />
      <l-m src="https://punch-ui-v2.pages.dev/packages/button/button.html"></l-m>
      <l-m src="https://punch-ui-v2.pages.dev/packages/input/input.html"></l-m>
      <div style="padding: 20px; max-width: 400px;">
        <p-input id="username-input">
          <span slot="label">用户名</span>
        </p-input>
        <p-button id="get-value-btn" style="margin-top: 16px;">获取值</p-button>
        <p style="margin-top: 16px;">当前值: <span id="value-display"></span></p>
      </div>
      <script>
        export default async () => {
          return {
            ready() {
              const input = this.$('#username-input');
              const btn = this.$('#get-value-btn');
              const display = this.$('#value-display');
              btn.on('click', () => {
                display.text = input.value;
              });
            }
          };
        };
      </script>
    </template>
  </code>
        </o-playground>
        <h3>监听输入事件</h3>
        <p>通过监听 <code>input</code> 事件实时获取输入值：</p>
        <o-playground name="监听输入事件" style="--editor-height: 400px">
          <code path="demo.html" preview active>
    <template page>
      <link rel="stylesheet" href="https://punch-ui-v2.pages.dev/packages/css/pui-global.css" />
      <l-m src="https://punch-ui-v2.pages.dev/packages/input/input.html"></l-m>
      <div style="padding: 20px; max-width: 400px;">
        <p-input id="realtime-input">
          <span slot="label">实时输入</span>
        </p-input>
        <p style="margin-top: 16px;">实时值: <span id="realtime-display"></span></p>
      </div>
      <script>
        export default async () => {
          return {
            ready() {
              const input = this.$('#realtime-input');
              const display = this.$('#realtime-display');
              input.on('input', () => {
                display.text = input.value;
              });
            }
          };
        };
      </script>
    </template>
  </code>
        </o-playground>
        <h3>双向绑定</h3>
        <p>使用 ofa.js 的数据绑定功能：</p>
        <o-playground name="双向绑定" style="--editor-height: 400px">
          <code path="demo.html" preview active>
    <template page>
      <link rel="stylesheet" href="https://punch-ui-v2.pages.dev/packages/css/pui-global.css" />
      <l-m src="https://punch-ui-v2.pages.dev/packages/input/input.html"></l-m>
      <div style="padding: 20px; max-width: 400px;">
        <p-input id="bind-input" :value="username">
          <span slot="label">用户名</span>
        </p-input>
        <p style="margin-top: 16px;">绑定值: {{username}}</p>
      </div>
      <script>
        export default async () => {
          return {
            data: {
              username: ""
            },
            ready() {
              const input = this.$('#bind-input');
              input.on('input', () => {
                this.username = input.value;
              });
            }
          };
        };
      </script>
    </template>
  </code>
        </o-playground>
        <h2>API</h2>

              <td><code>text</code></td>
            </tr>
            <tr>
              <td><code>variant</code></td>
              <td>输入框样式</td>
              <td><code>outlined</code> | <code>filled</code></td>

            <tr>
              <td><code>color</code></td>
              <td>输入框颜色</td>

              <td>-</td>
            </tr>
            <tr>
              <td><code>placeholder</code></td>
              <td>占位文本</td>
              <td><code>string</code></td>
              <td>-</td>

            <tr>

            <tr>

            <tr>

            </tr>
            <tr>

            </tr>
            <tr>
              <td><code>maxlength</code></td>

            <tr>

        <h3>插槽</h3>
        <table>
          <thead>
            <tr>
              <th>插槽名</th>
              <th>说明</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td><code>default</code></td>

              <td>标签文本</td>
            </tr>
            <tr>

          <thead>
            <tr>
              <th>方法名</th>
              <th>说明</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td><code>focus()</code></td>
              <td>使输入框获得焦点</td>

            <tr>
              <td><code>blur()</code></td>
              <td>使输入框失去焦点</td>

      <script>
        export const parent = "../../layout.html";
        export default async ({
          load,
          query
        }) => {
          const {
            init,
            revoke
          } = await load("../../js/init.js");
          return {
            data: {},
            attached() {
              init(this, query);
              setTimeout(() => {
                this.style.transform = "";
              }, 300);
            },
            detached() {
              revoke(this);
            },
          };
        };
      </script>
