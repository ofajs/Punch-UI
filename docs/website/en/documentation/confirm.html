<body>
  <o-app src="../../js/app-config.js">

      <article class="markdown-body">
        <h1>Confirm Dialog</h1>
        <p>Confirm is used to display a confirmation dialog， which contains confirm and cancel buttons。 It is suitable for operation scenarios that require user confirmation。</p>
        <h2>Introduction</h2>
        <pre><code class="hljs language-javascript"><span class="hljs-keyword">import</span> confirm <span class="hljs-keyword">from</span> <span class="hljs-string">&#x27;https://punch-ui-v2.pages.dev/packages/util/confirm.js&#x27;</span>;</code></pre>
        <h2>Basic Usage</h2>
        <o-playground name="Confirm Basic Usage" style="--editor-height: 400px">
          <code path="demo.html" active>
    <template page>
      <link rel="stylesheet" href="https://punch-ui-v2.pages.dev/packages/css/pui-global.css" />
      <l-m src="https://punch-ui-v2.pages.dev/packages/button/button.html"></l-m>
      <script type="module">
        import confirm from 'https://punch-ui-v2.pages.dev/packages/util/confirm.js';
        import toast from 'https://punch-ui-v2.pages.dev/packages/util/toast.js';
        export default async () => {
          return {
            proto: {
              async showConfirm() {
                const result = await confirm('Are you sure you want to delete?');
                if (result) {
                  toast('Deleted');
                } else {
                  toast('Cancelled');
                }
              }
            }
          };
        };
      </script>
      <div style="padding: 20px; text-align: center;">
        <p-button color="error" on:click="showConfirm">Delete</p-button>
      </div>
    </template>
  </code>
        </o-playground>
        <h2>Complete Parameter Example</h2>
        <o-playground name="Confirm Full Parameters" style="--editor-height: 500px">
          <code path="demo.html" active>
    <template page>
      <link rel="stylesheet" href="https://punch-ui-v2.pages.dev/packages/css/pui-global.css" />
      <l-m src="https://punch-ui-v2.pages.dev/packages/button/button.html"></l-m>
      <script type="module">
        import confirm from 'https://punch-ui-v2.pages.dev/packages/util/confirm.js';
        import toast from 'https://punch-ui-v2.pages.dev/packages/util/toast.js';
        export default async () => {
          return {
            proto: {
              async showFullConfirm() {
                const result = await confirm({
                  title: 'Delete Confirmation',
                  message: 'This action will permanently delete the file and cannot be undone. Are you sure you want to continue?',
                  yes: 'Confirm Delete',
                  cancel: 'Think Again'
                });
                if (result) {
                  toast('File deleted');
                } else {
                  toast('Operation cancelled');
                }
              }
            }
          };
        };
      </script>
      <div style="padding: 20px; text-align: center;">
        <p-button color="error" on:click="showFullConfirm">Delete File</p-button>
      </div>
    </template>
  </code>
        </o-playground>
        <h2>API</h2>
        <h3>Parameters</h3>
        <table>
          <thead>
            <tr>
              <th>Parameter</th>
              <th>Type</th>
              <th>Default</th>
              <th>Description</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>title</td>
              <td><code>string</code></td>
              <td><code>&#39;&#39;</code></td>
              <td>Dialog title</td>
            </tr>
            <tr>
              <td>message</td>
              <td><code>string</code></td>
              <td>-</td>
              <td>Prompt message content</td>
            </tr>
            <tr>
              <td>yes</td>
              <td><code>string</code></td>
              <td><code>&#39;Yes&#39;</code></td>
              <td>Confirm button text</td>
            </tr>
            <tr>
              <td>cancel</td>
              <td><code>string</code></td>
              <td><code>&#39;Cancel&#39;</code></td>
              <td>Cancel button text</td>
            </tr>
          </tbody>
        </table>
        <p>Returns a Promise, which resolves to <code>true</code> if the user clicks confirm, and <code>false</code> if the user clicks cancel.</p>
        <h3>Example</h3>
        <pre><code class="hljs language-javascript"><span class="hljs-comment">// Basic Usage</span>
<span class="hljs-keyword">const</span> result = <span class="hljs-keyword">await</span> <span class="hljs-title function_">confirm</span>(<span class="hljs-string">&#x27;Are you sure you want to delete?&#x27;</span>);
<span class="hljs-keyword">if</span> (result) {
  <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&#x27;User confirmed deletion&#x27;</span>);
} <span class="hljs-keyword">else</span> {
  <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&#x27;User cancelled deletion&#x27;</span>);
}

<span class="hljs-comment">// Full Parameters</span>
<span class="hljs-keyword">const</span> result = <span class="hljs-keyword">await</span> <span class="hljs-title function_">confirm</span>({
  <span class="hljs-attr">title</span>: <span class="hljs-string">&#x27;Delete Confirmation&#x27;</span>,
  <span class="hljs-attr">message</span>: <span class="hljs-string">&#x27;This action will permanently delete the file and cannot be recovered. Are you sure you want to continue?&#x27;</span>,
  <span class="hljs-attr">yes</span>: <span class="hljs-string">&#x27;Confirm Delete&#x27;</span>,
  <span class="hljs-attr">cancel</span>: <span class="hljs-string">&#x27;Think Again&#x27;</span>
});</code></pre>
      </article>
      <div class="footer"></div>
      <script>
        export const parent = "../../layout.html";
        export default async ({
          load,
          query
        }) => {
          const {
            init,
            revoke
          } = await load("../../js/init.js");
          return {
            data: {},
            attached() {
              init(this, query);
              setTimeout(() => {
                this.style.transform = "";
              }, 300);
            },
            detached() {
              revoke(this);
            },
          };
        };
      </script>
