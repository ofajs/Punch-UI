<body>
  <o-app src="../../js/app-config.js">
    <template page>

      <article class="markdown-body">
        <h1>Button</h1>
        <p>The button component is one of the most commonly used components in Punch-UI, offering a variety of styles, sizes, and color choices.</p>
        <h2>Importing Components</h2>
        <pre><code class="hljs language-html"><span class="hljs-tag">&lt;<span class="hljs-name">l-m</span> <span class="hljs-attr">src</span>=<span class="hljs-string">&quot;https://punch-ui-v2.pages.dev/packages/button/button.html&quot;</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">l-m</span>&gt;</span></code></pre>
        <h2>Basic Usage</h2>
        <o-playground name="Button Basic Usage" style="--editor-height: 300px">
          <code path="demo.html" preview active>
    <template>
      <link rel="stylesheet" href="https://punch-ui-v2.pages.dev/packages/css/pui-global.css" />
      <l-m src="https://punch-ui-v2.pages.dev/packages/button/button.html"></l-m>
      <div style="padding: 20px;">
        <p-button>Default Button</p-button>
      </div>
    </template>
  </code>
        </o-playground>
        <h2>Button Variants</h2>
        <p>Set button style via the <code>variant</code> property:</p>
        <o-playground name="Button Variants" style="--editor-height: 350px">
          <code path="demo.html" preview active>
    <template>
      <link rel="stylesheet" href="https://punch-ui-v2.pages.dev/packages/css/pui-global.css" />
      <l-m src="https://punch-ui-v2.pages.dev/packages/button/button.html"></l-m>
      <div style="padding: 20px;">
        <p-button variant="filled">Filled Button</p-button>
        <p-button variant="outlined">Outlined Button</p-button>
        <p-button variant="text">Text Button</p-button>
      </div>
    </template>
  </code>
        </o-playground>
        <h2>Dimensions</h2>
        <p>Set button size via the <code>size</code> attribute:</p>
        <o-playground name="Button Size" style="--editor-height: 350px">
          <code path="demo.html" preview active>
    <template>
      <link rel="stylesheet" href="https://punch-ui-v2.pages.dev/packages/css/pui-global.css" />
      <l-m src="https://punch-ui-v2.pages.dev/packages/button/button.html"></l-m>
      <div style="padding: 20px;">
        <p-button size="xs">Extra Small</p-button>
        <p-button size="s">Small</p-button>
        <p-button>Default</p-button>
        <p-button size="l">Large</p-button>
        <p-button size="xl">Extra Large</p-button>
      </div>
    </template>
  </code>
        </o-playground>
        <h2>Colors</h2>
        <p>Set the button color through the <code>color</code> attribute:</p>
        <o-playground name="Button Color" style="--editor-height: 350px">
          <code path="demo.html" preview active>
    <template>
      <link rel="stylesheet" href="https://punch-ui-v2.pages.dev/packages/css/pui-global.css" />
      <l-m src="https://punch-ui-v2.pages.dev/packages/button/button.html"></l-m>
      <div style="padding: 20px;">
        <p-button>Default</p-button>
        <p-button color="primary">Primary</p-button>
        <p-button color="error">Error</p-button>
        <p-button color="success">Success</p-button>
        <p-button color="neutral">Neutral</p-button>
      </div>
    </template>
  </code>
        </o-playground>
        <h2>Icon Button</h2>
        <p>Add the <code>icon</code> attribute to make the button a circular icon button:</p>
        <o-playground name="Icon Button" style="--editor-height: 300px">
          <code path="demo.html" preview active>
    <template>
      <link rel="stylesheet" href="https://punch-ui-v2.pages.dev/packages/css/pui-global.css" />
      <l-m src="https://punch-ui-v2.pages.dev/packages/button/button.html"></l-m>
      <div style="padding: 20px;">
        <p-button icon>+</p-button>
        <p-button icon size="s">-</p-button>
        <p-button icon size="l">×</p-button>
      </div>
    </template>
  </code>
        </o-playground>
        <h2>With Prefix/Suffix</h2>
        <p>Use the <code>prefix</code> and <code>suffix</code> slots to add icons or text:</p>
        <o-playground name="Buttons with Prefix/Suffix" style="--editor-height: 300px">
          <code path="demo.html" preview active>
    <template>
      <link rel="stylesheet" href="https://punch-ui-v2.pages.dev/packages/css/pui-global.css" />
      <l-m src="https://punch-ui-v2.pages.dev/packages/button/button.html"></l-m>
      <div style="padding: 20px;">
        <p-button>
          <span slot="prefix">🔍</span>
          Search
        </p-button>
        <p-button>
          Settings
          <span slot="suffix">⚙️</span>
        </p-button>
      </div>
    </template>
  </code>
        </o-playground>
        <h2>Disabled State</h2>
        <p>Add the <code>disabled</code> attribute to disable the button:</p>
        <o-playground name="Disabled State" style="--editor-height: 300px">
          <code path="demo.html" preview active>
    <template>
      <link rel="stylesheet" href="https://punch-ui-v2.pages.dev/packages/css/pui-global.css" />
      <l-m src="https://punch-ui-v2.pages.dev/packages/button/button.html"></l-m>
      <div style="padding: 20px;">
        <p-button disabled>Disabled Button</p-button>
        <p-button variant="outlined" disabled>Disabled Outlined</p-button>
      </div>
    </template>
  </code>
        </o-playground>
        <h2>Autofocus</h2>
        <p>Use the <code>autofocus</code> attribute to make the button automatically receive focus when the page loads:</p>
        <o-playground name="Auto Focus" style="--editor-height: 300px">
          <code path="demo.html" preview active>
    <template>
      <link rel="stylesheet" href="https://punch-ui-v2.pages.dev/packages/css/pui-global.css" />
      <l-m src="https://punch-ui-v2.pages.dev/packages/button/button.html"></l-m>
      <div style="padding: 20px;">
        <p-button autofocus>Auto Focus Button</p-button>
        <p-button>Normal Button</p-button>
      </div>
    </template>
  </code>
        </o-playground>
        <h2>Button Group</h2>
        <p>Use button groups to combine multiple buttons together:</p>
        <o-playground name="Button Group" style="--editor-height: 400px">
          <code path="demo.html" preview active>
    <template>
      <link rel="stylesheet" href="https://punch-ui-v2.pages.dev/packages/css/pui-global.css" />
      <l-m src="https://punch-ui-v2.pages.dev/packages/button/button.html"></l-m>
      <l-m src="https://punch-ui-v2.pages.dev/packages/button/group.html"></l-m>
      <div style="padding: 20px;">
        <h4>Basic Button Group</h4>
        <p-button-group>
          <p-button>Button 1</p-button>
          <p-button>Button 2</p-button>
          <p-button>Button 3</p-button>
        </p-button-group>
        <h4 style="margin-top: 20px;">Connected Button Group</h4>
        <p-button-group connected>
          <p-button variant="outlined">Home</p-button>
          <p-button variant="outlined">Products</p-button>
          <p-button variant="outlined">About</p-button>
        </p-button-group>
        <h4 style="margin-top: 20px;">Full-width Button Group</h4>
        <p-button-group full-width>
          <p-button>Left</p-button>
          <p-button>Center</p-button>
          <p-button>Right</p-button>
        </p-button-group>
      </div>
    </template>
  </code>
        </o-playground>
        <h2>Advanced Usage</h2>
        <h3>Segment Control (Single Select)</h3>
        <p>Use button groups to implement segmented control, suitable for scenarios such as switching view modes:</p>
        <o-playground name="Segmented Control" style="--editor-height: 400px">
          <code path="demo.html" active>
    <template page>
      <link rel="stylesheet" href="https://punch-ui-v2.pages.dev/packages/css/pui-global.css" />
      <l-m src="https://punch-ui-v2.pages.dev/packages/button/button.html"></l-m>
      <l-m src="https://punch-ui-v2.pages.dev/packages/button/group.html"></l-m>
      <div style="padding: 20px;">
        <p-button-group>
          <p-button
            attr:variant="selected === 'day' ? 'filled' : 'outlined'"
            on:click="selected = 'day'"
          >
            Day
          </p-button>
          <p-button
            attr:variant="selected === 'week' ? 'filled' : 'outlined'"
            on:click="selected = 'week'"
          >
            Week
          </p-button>
          <p-button
            attr:variant="selected === 'month' ? 'filled' : 'outlined'"
            on:click="selected = 'month'"
          >
            Month
          </p-button>
        </p-button-group>
      </div>
      <script>
        export default {
          data: {
            selected: 'day'
          }
        };
      </script>
    </template>
  </code>
        </o-playground>
        <h3>Filter chips (multi-select)</h3>
        <p>Use button groups to implement a multi-select filter:</p>
        <o-playground name="Filter Chips" style="--editor-height: 400px">
          <code path="demo.html" active>
    <template page>
      <link rel="stylesheet" href="https://punch-ui-v2.pages.dev/packages/css/pui-global.css" />
      <l-m src="https://punch-ui-v2.pages.dev/packages/button/button.html"></l-m>
      <l-m src="https://punch-ui-v2.pages.dev/packages/button/group.html"></l-m>
      <style>
        p-button {
          transition: all 0.2s ease;
        }
      </style>
      <div style="padding: 20px;">
        <p-button-group>
          <p-button
            attr:color="filters.includes('all') ? 'primary' : 'neutral'"
            :style.border-radius="filters.includes('all') ? '28px' : ''"
            on:click="toggleFilter('all')"
          >
            All
          </p-button>
          <p-button
            attr:color="filters.includes('active') ? 'primary' : 'neutral'"
            :style.border-radius="filters.includes('active') ? '28px' : ''"
            on:click="toggleFilter('active')"
          >
            Active
          </p-button>
          <p-button
            attr:color="filters.includes('completed') ? 'primary' : 'neutral'"
            :style.border-radius="filters.includes('completed') ? '28px' : ''"
            on:click="toggleFilter('completed')"
          >
            Completed
          </p-button>
        </p-button-group>
      </div>
      <script>
        export default {
          data: {
            filters: ['all']
          },
          proto: {
            toggleFilter(filter) {
              const index = this.filters.indexOf(filter);
              if (index > -1) {
                this.filters.splice(index, 1);
              } else {
                this.filters.push(filter);
              }
            }
          }
        };
      </script>
    </template>
  </code>
        </o-playground>
        <h3>Sort Options</h3>
        <p>Implement sorting option switching using a button group:</p>
        <o-playground name="Sorting Options" style="--editor-height: 400px">
          <code path="demo.html" active>
    <template page>
      <link rel="stylesheet" href="https://punch-ui-v2.pages.dev/packages/css/pui-global.css" />
      <l-m src="https://punch-ui-v2.pages.dev/packages/button/button.html"></l-m>
      <l-m src="https://punch-ui-v2.pages.dev/packages/button/group.html"></l-m>
      <style>
        p-button {
          transition: all 0.2s ease;
        }
      </style>
      <div style="padding: 20px;">
        <p-button-group>
          <p-button
            attr:color="order === 'newest' ? 'primary' : 'neutral'"
            :style.border-radius="order === 'newest' ? '28px' : ''"
            on:click="order = 'newest'"
          >
            Newest
          </p-button>
          <p-button
            attr:color="order === 'oldest' ? 'primary' : 'neutral'"
            :style.border-radius="order === 'oldest' ? '28px' : ''"
            on:click="order = 'oldest'"
          >
            Oldest
          </p-button>
          <p-button
            attr:color="order === 'price' ? 'primary' : 'neutral'"
            :style.border-radius="order === 'price' ? '28px' : ''"
            on:click="order = 'price'"
          >
            Price
          </p-button>
        </p-button-group>
      </div>
      <script>
        export default {
          data: {
            order: 'newest'
          }
        };
      </script>
    </template>
  </code>
        </o-playground>
        <h2>API</h2>
        <h3>Attributes</h3>
        <table>
          <thead>
            <tr>
              <th>Property</th>
              <th>Description</th>
              <th>Type</th>
              <th>Default</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td><code>variant</code></td>
              <td>Button style</td>
              <td><code>filled</code> | <code>outlined</code> | <code>text</code></td>
              <td><code>filled</code></td>
            </tr>
            <tr>
              <td><code>size</code></td>
              <td>Button size</td>
              <td><code>xs</code> | <code>s</code> | <code>l</code> | <code>xl</code></td>
              <td>-</td>
            </tr>
            <tr>
              <td><code>color</code></td>
              <td>Button color</td>
              <td><code>primary</code> | <code>error</code> | <code>success</code> | <code>neutral</code></td>
              <td>-</td>
            </tr>
            <tr>
              <td><code>icon</code></td>
              <td>Whether it is an icon button</td>
              <td><code>boolean</code></td>
              <td><code>false</code></td>
            </tr>
            <tr>
              <td><code>disabled</code></td>
              <td>Whether it is disabled</td>
              <td><code>boolean</code></td>
              <td><code>false</code></td>
            </tr>
            <tr>
              <td><code>autofocus</code></td>
              <td>Whether to autofocus</td>
              <td><code>boolean</code></td>
              <td><code>false</code></td>
            </tr>
          </tbody>
        </table>
        <table>
          <thead>
            <tr>
              <th>Slot Name</th>
              <th>Description</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td><code>default</code></td>
              <td>Button content</td>
            </tr>
            <tr>
              <td><code>prefix</code></td>
              <td>Prefix content</td>
            </tr>
            <tr>
              <td><code>suffix</code></td>
              <td>Suffix content</td>
            </tr>
          </tbody>
        </table>
      </article>
      <div class="footer"></div>
      <script>
        export const parent = "../../layout.html";
        export default async ({
          load,
          query
        }) => {
          const {
            init,
            revoke
          } = await load("../../js/init.js");
          return {
            data: {},
            attached() {
              init(this, query);
              setTimeout(() => {
                this.style.transform = "";
              }, 300);
            },
            detached() {
              revoke(this);
            },
          };
        };
      </script>
    </template>
  </o-app>
  <o-root-provider name="pui" theme="dark"></o-root-provider>
</body>
