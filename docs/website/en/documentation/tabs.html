<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tabs</title>
  <script src="https://cdn.jsdelivr.net/gh/kirakiray/ofa.js@4.7.0/dist/ofa.mjs" type="module"></script>
  <script src="https://cdn.jsdelivr.net/gh/kirakiray/ofa.js@4.7.0/libs/scsr/dist/scsr.min.mjs" type="module"></script>
  <link rel="icon" href="../../img/logo.svg" />
  <link rel="stylesheet" href="../../css/palette.css" pui-colors />
  <link rel="stylesheet" href="../../css/theme.css" />
  <link rel="stylesheet" href="../../css/github-markdown.css" />
  <link rel="stylesheet" href="../../css/hljs.css" />
  <style>
    html,
    body {
      height: 100%;
      padding: 0;
      margin: 0;
      overflow: hidden;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        Segoe UI,
        Microsoft Yahei,
        Helvetica,
        Arial,
        sans-serif,
        Apple Color Emoji,
        Segoe UI Emoji;
    }

    o-app {
      height: 100%;
    }

    @keyframes fadein {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    o-app {
      animation: fadein 0.1s ease-in-out;
    }
  </style>
  <script type="module" src="../../js/util.js"></script>
  <!--google analytics-->
</head>

<body>
  <o-app src="../../js/app-config.js">
    <template page>
      <link rel="stylesheet" href="../../css/github-markdown.css" />
      <link rel="stylesheet" href="../../css/hljs.css" />
      <l-m src="../../comps/center-block.html"></l-m>
      <l-m src="../../comps/article-code.html"></l-m>
      <l-m src="https://playground.ofajs.com/comps/o-playground/o-playground.html"></l-m>
      <style>
        :host {
          display: block;
          width: 100%;
          height: 100%;
          box-sizing: border-box;
          overflow: auto;
        }
      </style>
      <link rel="stylesheet" href="../../css/page.css" />
      <article class="markdown-body">
        <h1>Tabs</h1>
        <p>Tab component, used to switch between different content.</p>
        <h2>Importing Components</h2>
        <pre><code class="hljs language-html"><span class="hljs-tag">&lt;<span class="hljs-name">l-m</span> <span class="hljs-attr">src</span>=<span class="hljs-string">&quot;https://punch-ui-v2.pages.dev/packages/tabs/tab-bar.html&quot;</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">l-m</span>&gt;</span></code></pre>
        <h2>Basic Usage</h2>
        <o-playground name="Tabs basic usage" style="--editor-height: 400px">
          <code path="demo.html" preview active>
    <template>
      <link rel="stylesheet" href="https://punch-ui-v2.pages.dev/packages/css/pui-global.css" />
      <l-m src="https://punch-ui-v2.pages.dev/packages/tabs/tab-bar.html"></l-m>
      <l-m src="https://punch-ui-v2.pages.dev/packages/tabs/tab-item.html"></l-m>
      <div style="padding: 20px;">
        <p-tab-bar>
          <p-tab-item active>Tab 1</p-tab-item>
          <p-tab-item>Tab 2</p-tab-item>
          <p-tab-item>Tab 3</p-tab-item>
        </p-tab-bar>
      </div>
    </template>
  </code>
        </o-playground>
        <h2>Label with Icon</h2>
        <p>Use the <code>icon</code> slot to add an icon:</p>
        <o-playground name="Tab Bar with Icons" style="--editor-height: 400px">
          <code path="demo.html" preview active>
    <template>
      <link rel="stylesheet" href="https://punch-ui-v2.pages.dev/packages/css/pui-global.css" />
      <l-m src="https://punch-ui-v2.pages.dev/packages/tabs/tab-bar.html"></l-m>
      <l-m src="https://punch-ui-v2.pages.dev/packages/tabs/tab-item.html"></l-m>
      <div style="padding: 20px;">
        <p-tab-bar>
          <p-tab-item active>
            <span slot="icon">🏠</span>
            <span>Home</span>
          </p-tab-item>
          <p-tab-item>
            <span slot="icon">📑</span>
            <span>Bookmarks</span>
          </p-tab-item>
          <p-tab-item>
            <span slot="icon">👤</span>
            <span>About</span>
          </p-tab-item>
        </p-tab-bar>
      </div>
    </template>
  </code>
        </o-playground>
        <h2>Disabled State</h2>
        <p>Add the <code>disabled</code> attribute to disable the label item:</p>
        <o-playground name="Disabled State" style="--editor-height: 400px">
          <code path="demo.html" preview active>
    <template>
      <link rel="stylesheet" href="https://punch-ui-v2.pages.dev/packages/css/pui-global.css" />
      <l-m src="https://punch-ui-v2.pages.dev/packages/tabs/tab-bar.html"></l-m>
      <l-m src="https://punch-ui-v2.pages.dev/packages/tabs/tab-item.html"></l-m>
      <div style="padding: 20px;">
        <p-tab-bar>
          <p-tab-item active>
            <span slot="icon">🏠</span>
            <span>Home</span>
          </p-tab-item>
          <p-tab-item disabled>
            <span slot="icon">⚙️</span>
            <span>Settings</span>
          </p-tab-item>
          <p-tab-item>
            <span slot="icon">👤</span>
            <span>About</span>
          </p-tab-item>
        </p-tab-bar>
      </div>
    </template>
  </code>
        </o-playground>
        <h2>Scrollable Tab Bar</h2>
        <p>When there are too many tab items, you can set scrolling:</p>
        <o-playground name="Scrollable Tab Bar" style="--editor-height: 400px">
          <code path="demo.html" preview active>
    <template>
      <link rel="stylesheet" href="https://punch-ui-v2.pages.dev/packages/css/pui-global.css" />
      <l-m src="https://punch-ui-v2.pages.dev/packages/tabs/tab-bar.html"></l-m>
      <l-m src="https://punch-ui-v2.pages.dev/packages/tabs/tab-item.html"></l-m>
      <div style="padding: 20px;">
        <p-tab-bar style="overflow-x: auto">
          <p-tab-item active>Tab One</p-tab-item>
          <p-tab-item>Tab Two</p-tab-item>
          <p-tab-item>Tab Three</p-tab-item>
          <p-tab-item>Tab Four</p-tab-item>
          <p-tab-item>Tab Five</p-tab-item>
          <p-tab-item>Tab Six</p-tab-item>
          <p-tab-item>Tab Seven</p-tab-item>
        </p-tab-bar>
      </div>
    </template>
  </code>
        </o-playground>
        <h2>Using in Page Modules</h2>
        <p>In the page module, click switching of tabs can be realized through data binding:</p>
        <o-playground name="Tab Switching in Page Module" style="--editor-height: 500px">
          <code path="demo.html" active>
    <template page>
      <link rel="stylesheet" href="https://punch-ui-v2.pages.dev/packages/css/pui-global.css" />
      <l-m src="https://punch-ui-v2.pages.dev/packages/tabs/tab-bar.html"></l-m>
      <l-m src="https://punch-ui-v2.pages.dev/packages/tabs/tab-item.html"></l-m>
      <div style="padding: 20px;">
        <p-tab-bar>
          <p-tab-item attr:active="active === 'home'" on:click="active = 'home'">
            <span slot="icon">🏠</span>
            <span>Home</span>
          </p-tab-item>
          <p-tab-item attr:active="active === 'bookmarks'" on:click="active = 'bookmarks'">
            <span slot="icon">📑</span>
            <span>Bookmarks</span>
          </p-tab-item>
          <p-tab-item attr:active="active === 'about'" on:click="active = 'about'">
            <span slot="icon">👤</span>
            <span>About</span>
          </p-tab-item>
        </p-tab-bar>
        <div style="margin-top: 20px; padding: 16px; background-color: var(--md-sys-color-surface-container);">
          Currently selected: {{ active }}
        </div>
      </div>
      <script>
        export default {
          data: {
            active: 'home'
          }
        };
      </script>
    </template>
  </code>
        </o-playground>
        <h2>API</h2>
        <h3>Props - p-tab-item</h3>
        <table>
          <thead>
            <tr>
              <th>Property</th>
              <th>Description</th>
              <th>Type</th>
              <th>Default</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td><code>active</code></td>
              <td>Whether it is active</td>
              <td><code>boolean</code></td>
              <td><code>false</code></td>
            </tr>
            <tr>
              <td><code>disabled</code></td>
              <td>Whether it is disabled</td>
              <td><code>boolean</code></td>
              <td><code>false</code></td>
            </tr>
          </tbody>
        </table>
        <table>
          <thead>
            <tr>
              <th>Slot Name</th>
              <th>Description</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td><code>default</code></td>
              <td>Label text content</td>
            </tr>
            <tr>
              <td><code>icon</code></td>
              <td>Icon content</td>
            </tr>
          </tbody>
        </table>
        <table>
          <thead>
            <tr>
              <th>Event Name</th>
              <th>Description</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td><code>change-active</code></td>
              <td>Triggered when the active state changes</td>
            </tr>
            <tr>
              <td><code>click</code></td>
              <td>Triggered when a tab item is clicked（not triggered when disabled）</td>
            </tr>
          </tbody>
        </table>
      </article>
      <div class="footer"></div>
      <script>
        export const parent = "../../layout.html";
        export default async ({
          load,
          query
        }) => {
          const {
            init,
            revoke
          } = await load("../../js/init.js");
          return {
            data: {},
            attached() {
              init(this, query);
              setTimeout(() => {
                this.style.transform = "";
              }, 300);
            },
            detached() {
              revoke(this);
            },
          };
        };
      </script>
    </template>
  </o-app>
  <o-root-provider name="pui" theme="dark"></o-root-provider>
</body>

</html>
