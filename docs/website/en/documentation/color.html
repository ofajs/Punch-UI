        <h1>Color System</h1>
        <p>Punch-UI uses the color system of Material Design 3, providing a complete palette and theme support.</p>
        <blockquote>
          <p>🎯 <strong>Core Principle</strong>: <strong>Always prioritize using semantic color variables (<code>--md-sys-color-*</code>)</strong>, avoid directly using palette colors (<code>--md-ref-palette-*</code>). Semantic colors automatically adapt to theme switching, ensuring contrast and consistency.</p>
        </blockquote>
        <h2>Importing Styles</h2>
        <pre><code class="hljs language-html"><span class="hljs-tag">&lt;<span class="hljs-name">link</span> <span class="hljs-attr">rel</span>=<span class="hljs-string">"stylesheet"</span> <span class="hljs-attr">href</span>=<span class="hljs-string">"https://punch-ui-v2.pages.dev/packages/css/pui-global.css"</span> /&gt;</span></code></pre>
        <h2>Theme Switching</h2>
        <p>Punch-UI supports three theme modes:</p>
        <h3>1. Auto-Follow System (Default)</h3>
        <p>By default, the theme automatically follows the system settings:</p>
        <pre><code class="hljs language-html"><span class="hljs-tag">&lt;<span class="hljs-name">html</span>&gt;</span>
  <span class="hljs-comment">&lt;!-- Automatically follow system theme --&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">html</span>&gt;</span></code></pre>
        <h3>2. Force Light Theme</h3>
        <pre><code class="hljs language-html"><span class="hljs-tag">&lt;<span class="hljs-name">html</span> <span class="hljs-attr">class</span>=<span class="hljs-string">"theme-light-mode"</span>&gt;</span>
  <span class="hljs-comment">&lt;!-- Force light theme --&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">html</span>&gt;</span></code></pre>
        <h3>3. Force Dark Theme</h3>
        <pre><code class="hljs language-html"><span class="hljs-tag">&lt;<span class="hljs-name">html</span> <span class="hljs-attr">class</span>=<span class="hljs-string">"theme-dark-mode"</span>&gt;</span>
  <span class="hljs-comment">&lt;!-- Force dark theme --&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">html</span>&gt;</span></code></pre>
        <h3>Using Theme Switch Component</h3>
        <pre><code class="hljs language-html"><span class="hljs-tag">&lt;<span class="hljs-name">l-m</span> <span class="hljs-attr">src</span>=<span class="hljs-string">"https://punch-ui-v2.pages.dev/tool/theme-switch/theme-switch.html"</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">l-m</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">p-theme-switch</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">p-theme-switch</span>&gt;</span></code></pre>

        <h2>Best Practices</h2>
        <h3>1. Prioritize the use of semantic colors</h3>
        <p>✅ <strong>Recommended</strong>:```css background-color: var(--md-sys-color-primary); color: var(--md-sys-color-on-primary);</p>
        <pre><code class="hljs">
❌ **Not recommended**:```css
background-color: <span class="hljs-built_in">var</span>(--md-ref-palette-primary40);
<span class="hljs-attribute">color</span>: <span class="hljs-number">#ffffff</span>;</code></pre>
        <h3>2. Ensure contrast</h3>
        <p>When using semantic colors, Punch-UI ensures that the contrast between text and background meets accessibility standards.</p>
        <h3>3. Theme Adaptation</h3>
        <p>Semantic colors automatically adapt to dark/light themes, no manual processing required.</p>

          query

          const {
            init,
            revoke
          } = await load("../../js/init.js");
          return {
            data: {},
            attached() {
              init(this, query);
              setTimeout(() => {
                this.style.transform = "";
              }, 300);
            },
            detached() {
              revoke(this);
            },

        };
