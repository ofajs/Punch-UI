  <script src="https://cdn.jsdelivr.net/gh/kirakiray/ofa.js@4.7.0/libs/scsr/dist/scsr.min.mjs" type="module"></script>

<body>
  <o-app src="../../js/app-config.js">
    <template page>
      <link rel="stylesheet" href="../../css/github-markdown.css" />
      <link rel="stylesheet" href="../../css/hljs.css" />
      <l-m src="../../comps/center-block.html"></l-m>
      <l-m src="../../comps/article-code.html"></l-m>
      <l-m src="https://playground.ofajs.com/comps/o-playground/o-playground.html"></l-m>
      <style>
        :host {
          display: block;
          width: 100%;
          height: 100%;
          box-sizing: border-box;
          overflow: auto;
        }
      </style>
      <link rel="stylesheet" href="../../css/page.css" />
      <article class="markdown-body">
        <h1>Alert Warning Box</h1>
        <p>Alert is used to display a warning dialog with only a confirm button. It is suitable for scenarios such as important information prompts and operation result notifications.</p>
        <h2>Introduction</h2>
        <pre><code class="hljs language-javascript"><span class="hljs-keyword">import</span> alert <span class="hljs-keyword">from</span> <span class="hljs-string">&#x27;https://punch-ui-v2.pages.dev/packages/util/alert.js&#x27;</span>;</code></pre>
        <h2>Basic Usage</h2>
        <o-playground name="Alert Basic Usage" style="--editor-height: 400px">
          <code path="demo.html" active>
    <template page>
      <link rel="stylesheet" href="https://punch-ui-v2.pages.dev/packages/css/pui-global.css" />
      <l-m src="https://punch-ui-v2.pages.dev/packages/button/button.html"></l-m>
      <script type="module">
        import alert from 'https://punch-ui-v2.pages.dev/packages/util/alert.js';
        export default async () => {
          return {
            proto: {
              async showAlert() {
                await alert('This is a warning message');
              }
            }
          };
        };
      </script>
      <div style="padding: 20px; text-align: center;">
        <p-button color="primary" on:click="showAlert">Show Alert</p-button>
      </div>
    </template>
  </code>
        </o-playground>
        <h2>With Title and Custom Button</h2>
        <o-playground name="Alert Custom" style="--editor-height: 500px">
          <code path="demo.html" active>
    <template page>
      <link rel="stylesheet" href="https://punch-ui-v2.pages.dev/packages/css/pui-global.css" />
      <l-m src="https://punch-ui-v2.pages.dev/packages/button/button.html"></l-m>
      <script type="module">
        import alert from 'https://punch-ui-v2.pages.dev/packages/util/alert.js';
        export default async () => {
          return {
            proto: {
              async showCustomAlert() {
                await alert({
                  title: 'Tip',
                  message: 'Operation completed',
                  ok: 'Got it'
                });
              }
            }
          };
        };
      </script>
      <div style="padding: 20px; text-align: center;">
        <p-button color="primary" on:click="showCustomAlert">Custom Alert</p-button>
      </div>
    </template>
  </code>
        </o-playground>
        <h2>API</h2>
        <h3>Parameters</h3>
        <table>
          <thead>
            <tr>
              <th>Parameter</th>
              <th>Type</th>
              <th>Default</th>
              <th>Description</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>title</td>
              <td><code>string</code></td>
              <td><code>&#39;Prompt&#39;</code></td>
              <td>Dialog title</td>
            </tr>
            <tr>
              <td>message</td>
              <td><code>string</code></td>
              <td>-</td>
              <td>Prompt message content</td>
            </tr>
            <tr>
              <td>ok</td>
              <td><code>string</code></td>
              <td><code>&#39;OK&#39;</code></td>
              <td>Confirm button text</td>
            </tr>
          </tbody>
        </table>
        <p>Returns a Promise that resolves after the user clicks the confirm button.</p>
        <h3>Example</h3>
        <pre><code class="hljs language-javascript"><span class="hljs-comment">// Basic usage</span>
<span class="hljs-keyword">await</span> <span class="hljs-title function_">alert</span>(<span class="hljs-string">&#x27;This is an alert message&#x27;</span>);

<span class="hljs-comment">// With configuration</span>
<span class="hljs-keyword">await</span> <span class="hljs-title function_">alert</span>({
  <span class="hljs-attr">title</span>: <span class="hljs-string">&#x27;Notice&#x27;</span>,
  <span class="hljs-attr">message</span>: <span class="hljs-string">&#x27;Operation completed&#x27;</span>,
  <span class="hljs-attr">ok</span>: <span class="hljs-string">&#x27;Got it&#x27;</span>
});</code></pre>
      </article>
      <div class="footer"></div>
      <script>
        export const parent = "../../layout.html";
        export default async ({
          load,
          query
        }) => {
          const {
            init,
            revoke
          } = await load("../../js/init.js");
          return {
            data: {},
            attached() {
              init(this, query);
              setTimeout(() => {
                this.style.transform = "";
              }, 300);
            },
            detached() {
              revoke(this);
            },
          };
        };
      </script>
    </template>
  </o-app>
  <o-root-provider name="pui" theme="dark"></o-root-provider>
</body>

</html>
