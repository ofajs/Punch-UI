<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dialog</title>
  <script src="https://cdn.jsdelivr.net/gh/kirakiray/ofa.js@4.7.0/dist/ofa.mjs" type="module"></script>
  <script src="https://cdn.jsdelivr.net/gh/kirakiray/ofa.js@4.7.0/libs/scsr/dist/scsr.min.mjs" type="module"></script>
  <link rel="icon" href="../../img/logo.svg" />
  <link rel="stylesheet" href="../../css/palette.css" pui-colors />
  <link rel="stylesheet" href="../../css/theme.css" />
  <link rel="stylesheet" href="../../css/github-markdown.css" />
  <link rel="stylesheet" href="../../css/hljs.css" />
  <style>
    html,
    body {
      height: 100%;
      padding: 0;
      margin: 0;
      overflow: hidden;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        Segoe UI,
        Microsoft Yahei,
        Helvetica,
        Arial,
        sans-serif,
        Apple Color Emoji,
        Segoe UI Emoji;
    }

    o-app {
      height: 100%;
    }

    @keyframes fadein {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    o-app {
      animation: fadein 0.1s ease-in-out;
    }
  </style>
  <script type="module" src="../../js/util.js"></script>
  <!--google analytics-->
</head>

<body>
  <o-app src="../../js/app-config.js">
    <template page>
      <link rel="stylesheet" href="../../css/github-markdown.css" />
      <link rel="stylesheet" href="../../css/hljs.css" />
      <l-m src="../../comps/center-block.html"></l-m>
      <l-m src="../../comps/article-code.html"></l-m>
      <l-m src="https://playground.ofajs.com/comps/o-playground/o-playground.html"></l-m>
      <style>
        :host {
          display: block;
          width: 100%;
          height: 100%;
          box-sizing: border-box;
          overflow: auto;
        }
      </style>
      <link rel="stylesheet" href="../../css/page.css" />
      <article class="markdown-body">
        <h1>Dialog</h1>
        <p>Dialog components provide an elegant modal interaction experience, built-in mobile adaptive mechanisms, and support rich custom style options.</p>
        <p>The component has built-in responsive design and can intelligently recognize the device screen size. In a small screen environment on mobile devices, the dialog automatically switches to a drawer-style interaction that slides in from the bottom, providing an operation experience more in line with mobile user habits.</p>
        <h2>Importing Components</h2>
        <pre><code class="hljs language-html"><span class="hljs-tag">&lt;<span class="hljs-name">l-m</span> <span class="hljs-attr">src</span>=<span class="hljs-string">&quot;https://punch-ui-v2.pages.dev/packages/dialog/dialog.html&quot;</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">l-m</span>&gt;</span></code></pre>
        <h2>Basic Usage</h2>
        <o-playground name="Dialog Basic Usage" style="--editor-height: 500px">
          <code path="demo.html" active>
    <template page>
      <link rel="stylesheet" href="https://punch-ui-v2.pages.dev/packages/css/pui-global.css" />
      <l-m src="https://punch-ui-v2.pages.dev/packages/button/button.html"></l-m>
      <l-m src="https://punch-ui-v2.pages.dev/packages/dialog/dialog.html"></l-m>
      <div style="padding: 20px;">
        <p-button on:click="demoDialogOpen = true">
          Open Dialog
        </p-button>
        <p-dialog auto-close sync:open="demoDialogOpen">
          <span slot="title">Dialog Title</span>
          <div>
            <p>This is a dialog example.</p>
            <p>Click the mask layer to close the dialog.</p>
          </div>
          <div slot="bottom">
            <p-button color="primary" on:click="demoDialogOpen = false">OK</p-button>
            <p-button variant="text" on:click="demoDialogOpen = false">Cancel</p-button>
          </div>
        </p-dialog>
      </div>
      <script>
        export default {
          data: {
            demoDialogOpen: false
          }
        };
      </script>
    </template>
  </code>
        </o-playground>
        <h2>Dialog with Form</h2>
        <p>Form components can be placed in the dialog box:</p>
        <o-playground name="Dialog with Form" style="--editor-height: 500px">
          <code path="demo.html" active>
    <template page>
      <link rel="stylesheet" href="https://punch-ui-v2.pages.dev/packages/css/pui-global.css" />
      <l-m src="https://punch-ui-v2.pages.dev/packages/button/button.html"></l-m>
      <l-m src="https://punch-ui-v2.pages.dev/packages/input/input.html"></l-m>
      <l-m src="https://punch-ui-v2.pages.dev/packages/dialog/dialog.html"></l-m>
      <div style="padding: 20px;">
        <p-button on:click="formOpen = true">Open Form Dialog</p-button>
        <p-dialog sync:open="formOpen">
          <span slot="title">User Information</span>
          <div>
            <p-input style="display: block; margin: 8px 0;">
              <span slot="label">Username</span>
            </p-input>
            <p-input style="display: block; margin: 8px 0;">
              <span slot="label">Email</span>
            </p-input>
          </div>
          <div slot="bottom">
            <p-button color="primary" on:click="formOpen = false">Submit</p-button>
            <p-button variant="text" on:click="formOpen = false">Close</p-button>
          </div>
        </p-dialog>
      </div>
      <script>
        export default {
          data: {
            formOpen: false
          }
        };
      </script>
    </template>
  </code>
        </o-playground>
        <h2>Autofocus</h2>
        <p>When the dialog box opens, it can automatically focus on the input box：</p>
        <o-playground name="Auto Focus" style="--editor-height: 500px">
          <code path="demo.html" active>
    <template page>
      <link rel="stylesheet" href="https://punch-ui-v2.pages.dev/packages/css/pui-global.css" />
      <l-m src="https://punch-ui-v2.pages.dev/packages/button/button.html"></l-m>
      <l-m src="https://punch-ui-v2.pages.dev/packages/input/input.html"></l-m>
      <l-m src="https://punch-ui-v2.pages.dev/packages/dialog/dialog.html"></l-m>
      <div style="padding: 20px;">
        <p-button on:click="autofocusOpen = true">Open Auto-Focus Dialog</p-button>
        <p-dialog sync:open="autofocusOpen" auto-close>
          <span slot="title">Quick Input</span>
          <div>
            <p-input autofocus style="display: block; margin: 8px 0;">
              <span slot="label">Input Content</span>
            </p-input>
          </div>
          <div slot="bottom">
            <p-button color="primary" on:click="autofocusOpen = false">Done</p-button>
          </div>
        </p-dialog>
      </div>
      <script>
        export default {
          data: {
            autofocusOpen: false
          }
        };
      </script>
    </template>
  </code>
        </o-playground>
        <h2>Click Mask Event</h2>
        <p>Listening to overlay click events:</p>
        <o-playground name="Click Mask Event" style="--editor-height: 500px">
          <code path="demo.html" active>
    <template page>
      <link rel="stylesheet" href="https://punch-ui-v2.pages.dev/packages/css/pui-global.css" />
      <l-m src="https://punch-ui-v2.pages.dev/packages/button/button.html"></l-m>
      <l-m src="https://punch-ui-v2.pages.dev/packages/dialog/dialog.html"></l-m>
      <div style="padding: 20px;">
        <p-button on:click="maskDialogOpen = true">Open Dialog</p-button>
        <p style="margin-top: 8px; color: #666;">Last mask click: {{maskClickMsg}}</p>
        <p-dialog sync:open="maskDialogOpen" on:click-mask="handleMaskClick">
          <span slot="title">Click Mask Demo</span>
          <div>
            <p>Clicking the mask layer (outside the dialog) triggers the click-mask event.</p>
          </div>
          <div slot="bottom">
            <p-button color="primary" on:click="maskDialogOpen = false">Close</p-button>
          </div>
        </p-dialog>
      </div>
      <script>
        export default {
          data: {
            maskDialogOpen: false,
            maskClickMsg: "None"
          },
          proto: {
            handleMaskClick() {
              this.maskClickMsg = new Date().toLocaleTimeString();
              this.maskDialogOpen = false;
            }
          }
        };
      </script>
    </template>
  </code>
        </o-playground>
        <h2>Color Variants</h2>
        <p>Use the <code>color</code> attribute to set the dialog color:</p>
        <o-playground name="Color Variants" style="--editor-height: 500px">
          <code path="demo.html" active>
    <template page>
      <link rel="stylesheet" href="https://punch-ui-v2.pages.dev/packages/css/pui-global.css" />
      <l-m src="https://punch-ui-v2.pages.dev/packages/button/button.html"></l-m>
      <l-m src="https://punch-ui-v2.pages.dev/packages/dialog/dialog.html"></l-m>
      <div style="padding: 20px;">
        <p-button on:click="primaryOpen = true">Primary</p-button>
        <p-button on:click="successOpen = true">Success</p-button>
        <p-button on:click="errorOpen = true">Error</p-button>
        <p-dialog sync:open="primaryOpen" color="primary" auto-close>
          <span slot="title">Primary Color</span>
          <div>
            <p>This is a dialog with Primary color.</p>
          </div>
          <div slot="bottom">
            <p-button color="primary" on:click="primaryOpen = false">Close</p-button>
          </div>
        </p-dialog>
        <p-dialog sync:open="successOpen" color="success" auto-close>
          <span slot="title">Success Color</span>
          <div>
            <p>This is a dialog with Success color.</p>
          </div>
          <div slot="bottom">
            <p-button color="success" on:click="successOpen = false">Close</p-button>
          </div>
        </p-dialog>
        <p-dialog sync:open="errorOpen" color="error" auto-close>
          <span slot="title">Error Color</span>
          <div>
            <p>This is a dialog with Error color.</p>
          </div>
          <div slot="bottom">
            <p-button color="error" on:click="errorOpen = false">Close</p-button>
          </div>
        </p-dialog>
      </div>
      <script>
        export default {
          data: {
            primaryOpen: false,
            successOpen: false,
            errorOpen: false
          }
        };
      </script>
    </template>
  </code>
        </o-playground>
        <h2>API</h2>
        <h3>Attributes</h3>
        <table>
          <thead>
            <tr>
              <th>Attribute</th>
              <th>Description</th>
              <th>Type</th>
              <th>Default</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td><code>variant</code></td>
              <td>Dialog style</td>
              <td><code>filled</code> | <code>outlined</code> | <code>tonal</code></td>
              <td><code>tonal</code></td>
            </tr>
            <tr>
              <td><code>color</code></td>
              <td>Dialog color</td>
              <td><code>primary</code> | <code>error</code> | <code>success</code> | <code>neutral</code></td>
              <td><code>neutral</code></td>
            </tr>
            <tr>
              <td><code>open</code></td>
              <td>Whether to open</td>
              <td><code>boolean</code></td>
              <td><code>false</code></td>
            </tr>
            <tr>
              <td><code>auto-close</code></td>
              <td>Whether to auto-close when clicking the overlay</td>
              <td><code>boolean</code></td>
              <td><code>false</code></td>
            </tr>
            <tr>
              <td><code>auto-to-mobile-width</code></td>
              <td>Width threshold to trigger mobile style</td>
              <td><code>string</code></td>
              <td><code>540px</code></td>
            </tr>
          </tbody>
        </table>
        <table>
          <thead>
            <tr>
              <th>Slot Name</th>
              <th>Description</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td><code>title</code></td>
              <td>Dialog title</td>
            </tr>
            <tr>
              <td><code>header</code></td>
              <td>Header content (used with title)</td>
            </tr>
            <tr>
              <td><code>default</code></td>
              <td>Dialog content</td>
            </tr>
            <tr>
              <td><code>bottom</code></td>
              <td>Bottom button area</td>
            </tr>
            <tr>
              <td><code>footer</code></td>
              <td>Footer content (used with bottom)</td>
            </tr>
          </tbody>
        </table>
        <table>
          <thead>
            <tr>
              <th>Event Name</th>
              <th>Description</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td><code>click-mask</code></td>
              <td>Triggered when the mask layer is clicked</td>
            </tr>
          </tbody>
        </table>
      </article>
      <div class="footer"></div>
      <script>
        export const parent = "../../layout.html";
        export default async ({
          load,
          query
        }) => {
          const {
            init,
            revoke
          } = await load("../../js/init.js");
          return {
            data: {},
            attached() {
              init(this, query);
              setTimeout(() => {
                this.style.transform = "";
              }, 300);
            },
            detached() {
              revoke(this);
            },
          };
        };
      </script>
    </template>
  </o-app>
  <o-root-provider name="pui" theme="dark"></o-root-provider>
</body>

</html>
