        <h2>Nav Layout</h2>
        <p><code>p-nav-layout</code> is a responsive navigation layout component that automatically adjusts the style and position of the navigation bar based on the container width.</p>
        <h3>Auto-fit Window</h3>
        <p>The component has a built-in container query mechanism, which intelligently adjusts the layout based on the container width:</p>
        <ul>
          <li><strong>Mobile (&lt; 768px)</strong>: The navigation bar is located at the bottom, using a vertical layout with icons and text arranged vertically.</li>
          <li><strong>Tablet (768px - 1024px)</strong>: The navigation bar is at the bottom and automatically switches to a tab-inline mode, with icons and text arranged horizontally.</li>
          <li><strong>Desktop (≥ 1024px)</strong>: The navigation bar automatically moves to the left, using a vertical layout to provide more spacious content display area.</li>
        </ul>
        <p>This adaptive design ensures an optimal user experience across different devices without the need to manually write responsive code.</p>
        <h3>Import Components</h3>
        <pre><code class="hljs language-html"><span class="hljs-tag">&lt;<span class="hljs-name">l-m</span> <span class="hljs-attr">src</span>=<span class="hljs-string">&quot;https://punch-ui-v2.pages.dev/packages/navigation/nav-layout.html&quot;</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">l-m</span>&gt;</span></code></pre>
        <h3>Basic Usage</h3>
        <o-playground name="Navigation Layout" style="--editor-height: 600px">
          <code path="demo.html" active>
    <template page>
      <link rel="stylesheet" href="https://punch-ui-v2.pages.dev/packages/css/pui-global.css" />
      <l-m src="https://punch-ui-v2.pages.dev/packages/navigation/nav-layout.html"></l-m>
      <l-m src="https://punch-ui-v2.pages.dev/packages/navigation/nav-bar.html"></l-m>
      <l-m src="https://punch-ui-v2.pages.dev/packages/navigation/nav-item.html"></l-m>
      <div style="height: 100%;">
        <p-nav-layout>
          <div style="padding: 20px;">
            <o-if :value="active === 'home'">
              <h1>Home</h1>
              <p>This is the home content...</p>
            </o-if>
            <o-if :value="active === 'bookmarks'">
              <h1>Bookmarks</h1>
              <p>This is the bookmarks content...</p>
            </o-if>
            <o-if :value="active === 'about'">
              <h1>About</h1>
              <p>This is the about content...</p>
            </o-if>
          </div>
          <p-nav-bar slot="nav">
            <p-nav-item attr:active="active === 'home'" on:click="active = 'home'">
              <span slot="icon">🏠</span>
              <span>Home</span>
            </p-nav-item>
            <p-nav-item attr:active="active === 'bookmarks'" on:click="active = 'bookmarks'">
              <span slot="icon">📑</span>
              <span>Bookmarks</span>
            </p-nav-item>
            <p-nav-item attr:active="active === 'about'" on:click="active = 'about'">
              <span slot="icon">👤</span>
              <span>About</span>
            </p-nav-item>
          </p-nav-bar>
        </p-nav-layout>
      </div>
      <script>
        export default async () => {
          return {
            data: {
              active: 'home'
            }
          };
        };
      </script>
    </template>
  </code>
