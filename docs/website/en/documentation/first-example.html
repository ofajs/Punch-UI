  <o-app src="../../js/app-config.js">

      <article class="markdown-body">
        <h1>First Example</h1>
        <p>Let's create a simple form example to demonstrate the basic usage of Punch-UI.</p>
        <h2>Example: User Registration Form</h2>
        <p>This example will show how to create a user registration form using Punch-UI's form components.</p>
        <o-playground name="User Registration Form" style="--editor-height: 600px">
          <code path="demo.html" preview="" active="">
    <template>
      <link rel="stylesheet" href="https://punch-ui-v2.pages.dev/packages/css/pui-global.css">
      <l-m src="https://punch-ui-v2.pages.dev/packages/input/input.html"></l-m>
      <l-m src="https://punch-ui-v2.pages.dev/packages/button/button.html"></l-m>
      <l-m src="https://punch-ui-v2.pages.dev/packages/radio/radio.html"></l-m>
      <l-m src="https://punch-ui-v2.pages.dev/packages/radio/group.html"></l-m>
      <l-m src="https://punch-ui-v2.pages.dev/packages/checkbox/checkbox.html"></l-m>
      <style>
        .form-container {
          max-width: 400px;
          margin: 40px auto;
          padding: 20px;
        }
        .form-item {
          margin-bottom: 16px;
        }
        .form-label {
          display: block;
          margin-bottom: 8px;
          font-weight: 500;
        }
        .form-actions {
          margin-top: 24px;
        }
      </style>
      <div class="form-container">
        <h2>User Registration</h2>
        <div class="form-item">
          <label class="form-label">Username</label>
          <p-input placeholder="Please enter username" style="width: 100%"></p-input>
        </div>
        <div class="form-item">
          <label class="form-label">Email</label>
          <p-input placeholder="Please enter email" type="email" style="width: 100%"></p-input>
        </div>
        <div class="form-item">
          <label class="form-label">Password</label>
          <p-input placeholder="Please enter password" type="password" style="width: 100%"></p-input>
        </div>
        <div class="form-item">
          <label class="form-label">Gender</label>
          <p-radio-group>
            <p-radio value="male">Male</p-radio>
            <p-radio value="female">Female</p-radio>
            <p-radio value="other">Other</p-radio>
          </p-radio-group>
        </div>
        <div class="form-item">
          <p-checkbox>I have read and agree to the user agreement</p-checkbox>
        </div>
        <div class="form-actions">
          <p-button color="primary" style="width: 100%">Register</p-button>
        </div>
      </div>
    </template>
  </code>
        </o-playground>
        <h2>Code Analysis</h2>
        <h3>1. Import necessary files</h3>
        <p>First, we need to import ofa.js, global styles, and the required components:</p>
        <pre><code class="hljs language-html"><span class="hljs-tag">&lt;<span class="hljs-name">link</span> <span class="hljs-attr">rel</span>=<span class="hljs-string">"stylesheet"</span> <span class="hljs-attr">href</span>=<span class="hljs-string">"https://punch-ui-v2.pages.dev/packages/css/pui-global.css"</span> /&gt;</span>

<span class="hljs-tag">&lt;<span class="hljs-name">l-m</span> <span class="hljs-attr">src</span>=<span class="hljs-string">"https://punch-ui-v2.pages.dev/packages/input/input.html"</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">l-m</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">l-m</span> <span class="hljs-attr">src</span>=<span class="hljs-string">"https://punch-ui-v2.pages.dev/packages/button/button.html"</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">l-m</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">l-m</span> <span class="hljs-attr">src</span>=<span class="hljs-string">"https://punch-ui-v2.pages.dev/packages/radio/radio.html"</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">l-m</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">l-m</span> <span class="hljs-attr">src</span>=<span class="hljs-string">"https://punch-ui-v2.pages.dev/packages/radio/group.html"</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">l-m</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">l-m</span> <span class="hljs-attr">src</span>=<span class="hljs-string">"https://punch-ui-v2.pages.dev/packages/checkbox/checkbox.html"</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">l-m</span>&gt;</span></code></pre>
        <h3>2. Using Components</h3>
        <p>Each Punch-UI component is prefixed with <code>p-</code>:</p>
        <ul>
          <li><code>&lt;p-input&gt;</code> - Input component</li>
          <li><code>&lt;p-button&gt;</code> - Button component</li>
          <li><code>&lt;p-radio&gt;</code> - Radio button component</li>
          <li><code>&lt;p-radio-group&gt;</code> - Radio group component</li>
          <li><code>&lt;p-checkbox&gt;</code> - Checkbox component</li>
        </ul>
        <h3>3. Component Properties</h3>
        <p>Components support multiple properties to customize behavior and appearance:</p>
        <pre><code class="hljs language-html"><span class="hljs-tag">&lt;<span class="hljs-name">p-input</span> <span class="hljs-attr">placeholder</span>=<span class="hljs-string">"Please enter username"</span> <span class="hljs-attr">type</span>=<span class="hljs-string">"email"</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">p-input</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">p-button</span> <span class="hljs-attr">color</span>=<span class="hljs-string">"primary"</span>&gt;</span>Register<span class="hljs-tag">&lt;/<span class="hljs-name">p-button</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">p-radio-group</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">p-radio</span> <span class="hljs-attr">value</span>=<span class="hljs-string">"male"</span>&gt;</span>Male<span class="hljs-tag">&lt;/<span class="hljs-name">p-radio</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">p-radio</span> <span class="hljs-attr">value</span>=<span class="hljs-string">"female"</span>&gt;</span>Female<span class="hljs-tag">&lt;/<span class="hljs-name">p-radio</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">p-radio-group</span>&gt;</span></code></pre>
        <h3>4. Style Customization</h3>
        <p>You can customize the component style through the <code>style</code> attribute or CSS class:</p>
        <pre><code class="hljs language-html"><span class="hljs-tag">&lt;<span class="hljs-name">p-input</span> <span class="hljs-attr">style</span>=<span class="hljs-string">"width: 100%"</span>&gt;</span><span class="hljs-tag">&lt;/<span class="hljs-name">p-input</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">p-button</span> <span class="hljs-attr">color</span>=<span class="hljs-string">"primary"</span> <span class="hljs-attr">style</span>=<span class="hljs-string">"width: 100%"</span>&gt;</span>Register<span class="hljs-tag">&lt;/<span class="hljs-name">p-button</span>&gt;</span></code></pre>
        <h2>More Examples</h2>
        <h3>Button Group Example</h3>
        <o-playground name="Button Group Example" style="--editor-height: 400px">
          <code path="demo.html" preview="" active="">
    <template>
      <link rel="stylesheet" href="https://punch-ui-v2.pages.dev/packages/css/pui-global.css">
      <l-m src="https://punch-ui-v2.pages.dev/packages/button/button.html"></l-m>
      <l-m src="https://punch-ui-v2.pages.dev/packages/button/group.html"></l-m>
      <div style="padding: 20px;">
        <h3>Basic Button</h3>
        <p-button>Default Button</p-button>
        <p-button color="primary">Primary Button</p-button>
        <p-button color="success">Success Button</p-button>
        <p-button color="error">Error Button</p-button>
        <h3 style="margin-top: 20px;">Button Group</h3>
        <p-button-group>
          <p-button>Button 1</p-button>
          <p-button>Button 2</p-button>
          <p-button>Button 3</p-button>
        </p-button-group>
      </div>
    </template>
  </code>

      </article>
      <div class="footer"></div>
      <script>
        export const parent = "../../layout.html";
        export default async ({
          load,
          query
        }) => {
          const {
            init,
            revoke
          } = await load("../../js/init.js");
          return {
            data: {},
            attached() {
              init(this, query);
              setTimeout(() => {
                this.style.transform = "";
              }, 300);
            },
            detached() {
              revoke(this);
            },
          };
        };
      </script>
    </template>
  </o-app>
  <o-root-provider name="pui" theme="dark"></o-root-provider>
</body>
