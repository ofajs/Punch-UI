      <article class="markdown-body">
        <h1>Prompt Input Box</h1>
        <p>Prompt is used to display an input dialog box that lets the user enter text. It is suitable for scenarios where user input is required.</p>
        <h2>Introduction</h2>
        <pre><code class="hljs language-javascript"><span class="hljs-keyword">import</span> prompt <span class="hljs-keyword">from</span> <span class="hljs-string">&#x27;https://punch-ui-v2.pages.dev/packages/util/prompt.js&#x27;</span>;</code></pre>
        <h2>Basic Usage</h2>
        <o-playground name="Prompt Basic Usage" style="--editor-height: 400px">
          <code path="demo.html" active>
    <template page>
      <link rel="stylesheet" href="https://punch-ui-v2.pages.dev/packages/css/pui-global.css" />
      <l-m src="https://punch-ui-v2.pages.dev/packages/button/button.html"></l-m>
      <script type="module">
        import prompt from 'https://punch-ui-v2.pages.dev/packages/util/prompt.js';
        import toast from 'https://punch-ui-v2.pages.dev/packages/util/toast.js';
        export default async () => {
          return {
            proto: {
              async showPrompt() {
                const result = await prompt('Please enter your name:');
                if (result !== null) {
                  toast(`Hello, ${result}!`);
                }
              }
            }
          };
        };
      </script>
      <div style="padding: 20px; text-align: center;">
        <p-button color="primary" on:click="showPrompt">Enter Name</p-button>
      </div>
    </template>
  </code>
        </o-playground>
        <h2>Complete Parameter Example</h2>
        <o-playground name="Prompt Full Parameters" style="--editor-height: 500px">
          <code path="demo.html" active>
    <template page>
      <link rel="stylesheet" href="https://punch-ui-v2.pages.dev/packages/css/pui-global.css" />
      <l-m src="https://punch-ui-v2.pages.dev/packages/button/button.html"></l-m>
      <script type="module">
        import prompt from 'https://punch-ui-v2.pages.dev/packages/util/prompt.js';
        import toast from 'https://punch-ui-v2.pages.dev/packages/util/toast.js';
        export default async () => {
          return {
            proto: {
              async showFullPrompt() {
                const result = await prompt({
                  title: 'Edit username',
                  message: 'Please enter new username:',
                  label: 'Username',
                  placeholder: 'Enter username',
                  value: 'Current User',
                  yes: 'Save',
                  cancel: 'Cancel'
                });
                if (result !== null) {
                  toast(`Username changed to:${result}`);
                }
              }
            }
          };
        };
      </script>
      <div style="padding: 20px; text-align: center;">
        <p-button color="primary" on:click="showFullPrompt">Edit username</p-button>
      </div>
    </template>
  </code>
        </o-playground>
        <h2>API</h2>
        <h3>Parameters</h3>
        <table>
          <thead>
            <tr>
              <th>Parameter</th>
              <th>Type</th>
              <th>Default</th>
              <th>Description</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>title</td>
              <td><code>string</code></td>
              <td><code>&#39;&#39;</code></td>
              <td>Dialog title</td>
            </tr>
            <tr>
              <td>message</td>
              <td><code>string</code></td>
              <td>-</td>
              <td>Prompt message content</td>
            </tr>
            <tr>
              <td>label</td>
              <td><code>string</code></td>
              <td><code>&#39;&#39;</code></td>
              <td>Input label</td>
            </tr>
            <tr>
              <td>placeholder</td>
              <td><code>string</code></td>
              <td><code>&#39;&#39;</code></td>
              <td>Input placeholder</td>
            </tr>
            <tr>
              <td>value</td>
              <td><code>string</code></td>
              <td><code>&#39;&#39;</code></td>
              <td>Default value of the input</td>
            </tr>
            <tr>
              <td>yes</td>
              <td><code>string</code></td>
              <td><code>&#39;Yes&#39;</code></td>
              <td>Confirm button text</td>
            </tr>
            <tr>
              <td>cancel</td>
              <td><code>string</code></td>
              <td><code>&#39;Cancel&#39;</code></td>
              <td>Cancel button text</td>
            </tr>
          </tbody>
        </table>
        <p>Return a Promise:- resolve is the text entered by the user (string)</p>
        <ul>
          <li>resolve being <code>null</code> indicates the user clicked cancel</li>
        </ul>
        <h3>Example</h3>
        <pre><code class="hljs language-javascript"><span class="hljs-comment">// Basic usage</span>
<span class="hljs-keyword">const</span> name = <span class="hljs-keyword">await</span> <span class="hljs-title function_">prompt</span>(<span class="hljs-string">&#x27;Please enter your name:&#x27;</span>);
<span class="hljs-keyword">if</span> (name !== <span class="hljs-literal">null</span>) {
  <span class="hljs-variable language_">console</span>.<span class="hljs-title function_">log</span>(<span class="hljs-string">&#x27;User input:&#x27;</span>, name);
}

<span class="hljs-comment">// Full parameters</span>
<span class="hljs-keyword">const</span> result = <span class="hljs-keyword">await</span> <span class="hljs-title function_">prompt</span>({
  <span class="hljs-attr">title</span>: <span class="hljs-string">&#x27;Modify Username&#x27;</span>,
  <span class="hljs-attr">message</span>: <span class="hljs-string">&#x27;Please enter a new username:&#x27;</span>,
  <span class="hljs-attr">label</span>: <span class="hljs-string">&#x27;Username&#x27;</span>,
  <span class="hljs-attr">placeholder</span>: <span class="hljs-string">&#x27;Enter username&#x27;</span>,
  <span class="hljs-attr">value</span>: <span class="hljs-string">&#x27;Current User&#x27;</span>,
  <span class="hljs-attr">yes</span>: <span class="hljs-string">&#x27;Save&#x27;</span>,
  <span class="hljs-attr">cancel</span>: <span class="hljs-string">&#x27;Cancel&#x27;</span>
});</code></pre>
      </article>
      <div class="footer"></div>
      <script>
        export const parent = "../../layout.html";
        export default async ({
          load,
          query
        }) => {
          const {
            init,
            revoke
          } = await load("../../js/init.js");
          return {
            data: {},
            attached() {
              init(this, query);
              setTimeout(() => {
                this.style.transform = "";
              }, 300);
            },
            detached() {
              revoke(this);
            },

        };
