<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Input Demo</title>
    <script
      src="https://cdn.jsdelivr.net/gh/ofajs/ofa.js/dist/ofa.min.mjs"
      type="module"
    ></script>
    <link rel="stylesheet" href="../css/theme.css" />
    <style>
      body {
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          Segoe UI,
          Microsoft Yahei,
          Helvetica,
          Arial,
          sans-serif,
          Apple Color Emoji,
          Segoe UI Emoji;
        padding: 20px;
      }
      p-input {
        margin: 16px;
        display: inline-block;
        width: 200px;
      }
      .demo-section {
        margin-bottom: 32px;
      }
      .demo-section h3 {
        margin-bottom: 16px;
        color: #333;
      }
    </style>
  </head>
  <body>
    <h2>Input</h2>

    <l-m src="./input.html"></l-m>

    <div class="demo-section">
      <h3>Basic Usage</h3>
      <p-input>
        <span slot="label">Username</span>
      </p-input>
    </div>

    <div class="demo-section">
      <h3>With Error State</h3>
      <p-input color="error"><span slot="label">Required Field</span> </p-input>
    </div>

    <div class="demo-section">
      <h3>Disabled State</h3>
      <p-input disabled><span slot="label">Disabled Input</span> </p-input>
    </div>

    <div class="demo-section">
      <h3>With Prefix</h3>
      <p-input>
        <span slot="prefix">+86</span><span slot="label">Phone Number</span>
      </p-input>
    </div>

    <div class="demo-section">
      <h3>With Suffix</h3>
      <p-input>
        <span slot="label">Website</span><span slot="suffix">.com</span>
      </p-input>
    </div>

    <div class="demo-section">
      <h3>Password Input</h3>
      <p-input type="password"><span slot="label">Password</span> </p-input>
    </div>

    <div class="demo-section">
      <h3>Number Input</h3>
      <p-input type="number"><span slot="label">Age</span> </p-input>
    </div>

    <script type="module">
      const inputs = $.all("p-input");
      inputs.forEach((input) => {
        input.on("input", (e) => {
          console.log("Input value:", e.detail.value);
        });
        input.on("focus", (e) => {
          console.log("Focus:", e.detail.value);
        });
        input.on("blur", (e) => {
          console.log("Blur:", e.detail.value);
        });
      });
    </script>
  </body>
</html>
