<template component>
  <l-m src="../field-container/field-container.html"></l-m>
  <style>
    :host {
      display: inline-block;
      border-radius: 8px;
      font-size: 16px;
    }

    :host([size="xs"]) {
      font-size: 12px;
    }

    :host([size="s"]),
    :host([size="small"]) {
      font-size: 14px;
    }

    :host([size="l"]),
    :host([size="large"]) {
      font-size: 18px;
    }

    :host([size="xl"]) {
      font-size: 20px;
    }

    input {
      width: 100%;
      height: 100%;
      background-color: transparent;
      border: none;
      outline: none;
      font-size: inherit;
      font-family: inherit;
      color: var(--md-sys-color-on-surface);
      -webkit-appearance: none;
    }

    p-field-container {
      border-radius: inherit;
    }

    :slotted([slot="label"]) {
      padding: 0 8px;
    }
  </style>
  <p-field-container
    attr:disabled="disabled"
    :color="color"
    :size="size"
    :variant="variant"
    attr:hang-label="isHangLabel"
    attr:focus="isFocus"
  >
    <input
      part="input"
      type="text"
      attr:type="type"
      attr:name="name"
      attr:placeholder="placeholder"
      attr:maxlength="maxlength"
      attr:min="min"
      attr:max="max"
      attr:readonly="readonly"
      on:focus="isFocus = true"
      on:blur="isFocus = false"
      on:change="emit('change')"
      on:input="emit('input', $event)"
      attr:disabled="disabled"
      sync:value="value"
    />
    <slot name="label" slot="label"></slot>
    <slot name="suffix" slot="suffix"></slot>
    <slot name="prefix" slot="prefix"></slot>
  </p-field-container>
  <script>
    export default async ({ load }) => {
      return {
        tag: "p-input",
        attrs: {
          variant: null,
          type: null,
          placeholder: null,
          color: null,
          size: null,
          disabled: null,
          name: null,
          error: null,
          defaultValue: null,
          autofocus: null,
          maxlength: null,
          min: null,
          max: null,
          readonly: null,
          hangLabel: null,
        },
        data: {
          value: "",
          isFocus: false,
        },
        watch: {
          autofocus(val) {
            if (val !== null) {
              setTimeout(() => {
                this.shadow.$("input").ele.focus();
              }, 150);
            }
          },
        },
        proto: {
          get isHangLabel() {
            if (this.hangLabel !== null) {
              return 1;
            }
            if (this.isFocus || !!this.value) {
              return 1;
            }
            if (this.placeholder) {
              return 1;
            }
            return null;
          },
          focus() {
            this.shadow.$("input").ele.focus();
          },
        },
        attached() {
          if (this.variant == "filled" && !this.$("[slot='label']")) {
            this.shadow
              .$("p-field-container")
              .style.setProperty("--field-container-padding-top", "0");
          }
          if (this.defaultValue !== null) {
            this.value = this.defaultValue;
          }
        },
      };
    };
  </script>
</template>
