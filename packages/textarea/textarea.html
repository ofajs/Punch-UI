<template component>
  <l-m src="../field-container/field-container.html"></l-m>
  <style>
    :host {
      display: inline-block;
      border-radius: 8px;
      font-size: 16px;
    }

    :host([size="xs"]) {
      font-size: 12px;
    }

    :host([size="s"]),
    :host([size="small"]) {
      font-size: 14px;
    }

    :host([size="l"]),
    :host([size="large"]) {
      font-size: 18px;
    }

    :host([size="xl"]) {
      font-size: 20px;
    }

    textarea {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      display: block;
      box-sizing: border-box;
      padding: 0.65em 0;
      background-color: transparent;
      border: none;
      outline: none;
      font-size: inherit;
      font-family: inherit;
      color: var(--md-sys-color-on-surface);
      -webkit-appearance: none;
      resize: none;
      box-sizing: border-box;
      line-height: 1.2em;
    }

    p-field-container {
      border-radius: inherit;
      height: auto;
    }

    :slotted([slot="label"]) {
      padding: 0 8px;
    }

    .fake-input {
      padding: 8px 0;
      height: 22px;
    }

    :host([size="xs"]) .fake-input {
      height: 17px;
    }

    :host([size="s"]) .fake-input,
    :host([size="small"]) .fake-input {
      height: 20px;
    }

    :host([size="l"]) .fake-input,
    :host([size="large"]) .fake-input {
      height: 25px;
    }

    :host([size="xl"]) .fake-input {
      height: 27px;
    }
  </style>
  <p-field-container
    attr:disabled="disabled"
    :color="color"
    :size="size"
    :variant="variant"
    attr:hang-label="isHangLabel"
    attr:focus="isFocus"
  >
    <textarea
      part="textarea"
      attr:name="name"
      attr:placeholder="placeholder"
      attr:maxlength="maxlength"
      attr:readonly="readonly"
      on:focus="isFocus = true"
      on:blur="isFocus = false"
      on:change="emit('change')"
      on:input="handleInput"
      attr:disabled="disabled"
      sync:value="value"
    ></textarea>
    <slot name="label" slot="label"></slot>
    <slot name="suffix" slot="suffix"></slot>
    <slot name="prefix" slot="prefix"></slot>
    <div class="fake-input"></div>
  </p-field-container>
  <script>
    export default async ({ load }) => {
      return {
        tag: "p-textarea",
        attrs: {
          variant: null,
          placeholder: null,
          color: null,
          size: null,
          disabled: null,
          name: null,
          error: null,
          defaultValue: null,
          autofocus: null,
          maxlength: null,
          readonly: null,
          hangLabel: null,
        },
        data: {
          value: "",
          isFocus: false,
        },
        watch: {
          autofocus(val) {
            if (val !== null) {
              setTimeout(() => {
                this.shadow.$("textarea").ele.focus();
              }, 150);
            }
          },
        },
        proto: {
          get isHangLabel() {
            if (this.hangLabel !== null) {
              return 1;
            }
            if (this.isFocus || !!this.value) {
              return 1;
            }
            if (this.placeholder) {
              return 1;
            }
            return null;
          },
          focus() {
            this.shadow.$("textarea").ele.focus();
          },
          handleInput(e) {
            const fieldContainer =
              this._fieldContainer ||
              (this._fieldContainer = this.shadow.$("p-field-container").ele);

            const textarea =
              this._textarea ||
              (this._textarea = this.shadow.$("textarea").ele);

            const fakeInput =
              this._fakeInput ||
              (this._fakeInput = this.shadow.$(".fake-input"));

            // 计算多少行
            const linesLength = this.value.split("\n").length;
            const lineHeight = parseFloat(
              getComputedStyle(textarea).lineHeight,
            );

            fakeInput.style.height = linesLength * lineHeight + 3 + "px";
          },
        },
        attached() {
          if (this.variant == "filled" && !this.$("[slot='label']")) {
            this.shadow
              .$("p-field-container")
              .style.setProperty("--field-container-padding-top", "0");
          }
          if (this.defaultValue !== null) {
            this.value = this.defaultValue;
          }
        },
      };
    };
  </script>
</template>
