<template component>
  <style>
    :host {
      display: block;
    }
  </style>
  <slot></slot>
  <script>
    export default async function () {
      return {
        tag: "p-radio-group",
        data: {
          value: null,
        },
        watch: {
          value(val) {
            if (val === null) return;
            const radios = this.all("p-radio");
            radios.forEach((rb) => {
              rb.checked = rb.value === val;
            });

            this.emit("change");
          },
        },
        proto: {
          updateValueFromChildren() {
            const radios = this.all("p-radio");
            if (this.value === null) {
              let checkedValue = null;
              radios.forEach((rb) => {
                if (rb.checked) {
                  checkedValue = rb.value;
                }
              });
              this.value = checkedValue;
            } else {
              radios.forEach((rb) => {
                rb.checked = rb.value === this.value;
              });
            }
          },
        },
        attached() {
          this.updateValueFromChildren();

          this.on("attached-radio", (e) => {
            this.updateValueFromChildren();
          });

          this.shadow.on("change", (e) => {
            const radio = $(e.target);
            if (!radio.is("p-radio")) {
              return;
            }

            e.stopPropagation();

            if (radio.checked) {
              const radios = this.all("p-radio");
              radios.forEach((rb) => {
                if (rb !== radio && rb.checked) {
                  rb.checked = false;
                }
              });
              this.value = radio.value;
            }
          });
        },
      };
    }
  </script>
</template>
