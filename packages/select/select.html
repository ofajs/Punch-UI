<template component>
  <l-m src="../field-container/field-container.html"></l-m>
  <l-m src="./option.html"></l-m>

  <style>
    :host {
      display: inline-block;
      border-radius: 8px;
      font-size: 16px;
      position: relative;
    }

    :host([size="xs"]) {
      font-size: 12px;
    }

    :host([size="s"]),
    :host([size="small"]) {
      font-size: 14px;
    }

    :host([size="l"]),
    :host([size="large"]) {
      font-size: 18px;
    }

    :host([size="xl"]) {
      font-size: 20px;
    }

    p-field-container {
      border-radius: inherit;
      cursor: pointer;
    }

    :host([disabled]) p-field-container {
      cursor: not-allowed;
    }

    .select-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .native-select {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
      font-size: inherit;
      z-index: 1;
    }

    :host([disabled]) .native-select {
      cursor: not-allowed;
    }

    .select-display {
      display: flex;
      align-items: center;
      width: 100%;
      height: 100%;
      min-height: 20px;
      pointer-events: none;
    }

    .select-value {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--md-sys-color-on-surface);
    }

    .placeholder {
      color: var(--md-sys-color-on-surface-variant);
      opacity: 0.6;
    }

    .arrow-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-left: 4px;
      transition: transform 0.2s ease;
      color: var(--md-sys-color-on-surface-variant);
      pointer-events: none;
    }

    :host(:focus-within) .arrow-icon {
      transform: rotate(180deg);
    }

    :slotted([slot="label"]) {
      padding: 0 8px;
    }
  </style>

  <p-field-container
    attr:disabled="disabled"
    :color="color"
    :size="size"
    :variant="variant"
    attr:hang-label="isHangLabel"
    attr:focus="isFocus"
  >
    <div class="select-wrapper">
      <select
        class="native-select"
        attr:name="name"
        attr:disabled="disabled"
        on:focus="handleFocus"
        on:blur="handleBlur"
        sync:value="value"
      ></select>
      <div class="select-display">
        <div class="select-value" class:placeholder="!value">
          {{ value ? displayText : (placeholder || '') }}
        </div>
        <div class="arrow-icon">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="m6 9l6 6l6-6" />
          </svg>
        </div>
      </div>
    </div>
    <slot name="label" slot="label"></slot>
    <slot name="suffix" slot="suffix"></slot>
    <slot name="prefix" slot="prefix"></slot>
  </p-field-container>

  <script>
    import "../common/init.js";

    export default async ({ load }) => {
      return {
        tag: "p-select",
        attrs: {
          variant: null,
          placeholder: null,
          color: null,
          size: null,
          disabled: null,
          name: null,
          hangLabel: null,
        },
        data: {
          value: null,
          isFocus: false,
          hasEmptyOption: false,
          _isSyncing: false,
        },
        watch: {
          value(val) {
            if (this._isSyncing) {
              return;
            }

            // 值被清空时取消选中并补回空选项
            if (val === null || val === "") {
              this._isSyncing = true;
              const nativeSelect = this.shadow.$(".native-select");
              nativeSelect.ele.selectedIndex = -1;
              if (!this.hasEmptyOption) {
                this.addEmptyOption();
              }
              this._isSyncing = false;
              return;
            }

            // 有值时删除空选项
            if (this.hasEmptyOption) {
              const nativeSelect = this.shadow.$(".native-select");
              const emptyOption = nativeSelect.$('[default-empty-option]');
              if (emptyOption) {
                emptyOption.remove();
                this.hasEmptyOption = false;
              }
            }

            this.emit("change", {
              data: { value: val },
            });
          },
        },
        proto: {
          get isHangLabel() {
            if (this.hangLabel !== null) {
              return 1;
            }
            if (this.isFocus || !!this.value) {
              return 1;
            }
            if (this.placeholder) {
              return 1;
            }
            return null;
          },
          get displayText() {
            const nativeSelect = this.shadow.$(".native-select").ele;
            if (nativeSelect.selectedIndex >= 0) {
              const selectedOption =
                nativeSelect.options[nativeSelect.selectedIndex];
              return selectedOption ? selectedOption.text : "";
            }
            return "";
          },
          focus() {
            this.shadow.$(".native-select").ele.focus();
          },
          handleFocus() {
            this.isFocus = true;
          },
          handleBlur() {
            this.isFocus = false;
          },
          addEmptyOption() {
            const nativeSelect = this.shadow.$(".native-select");
            
            // 检查是否已经有空选项
            const existingEmpty = nativeSelect.$('[default-empty-option]');
            if (existingEmpty) {
              return;
            }
            
            // 创建空选项
            const emptyOption = $({
              tag: "option",
              text: this.placeholder || ""
            });
            emptyOption.attr("value", "");
            emptyOption.attr("disabled", "");
            emptyOption.attr("default-empty-option", "");
            
            // 插入到第一个位置
            nativeSelect.unshift(emptyOption);
            this.hasEmptyOption = true;
          },
          syncOptionsFromChildren() {
            if (this._isSyncing) {
              return;
            }
            this._isSyncing = true;

            const nativeSelect = this.shadow.$(".native-select");
            const prevValue = this.value;

            // 清空原生 select
            nativeSelect.html = "";
            this.hasEmptyOption = false;

            // 添加默认空选项
            if (!prevValue) {
              this.addEmptyOption();
            }

            // 处理原生 option 元素
            const nativeOptions = this.ele.querySelectorAll("option");
            nativeOptions.forEach((opt) => {
              const optionEl = $({
                tag: "option",
                text: opt.textContent,
              });
              optionEl.attr("value", opt.value || opt.textContent);

              if (opt.disabled) {
                optionEl.attr("disabled", "");
              }

              if (opt.selected) {
                optionEl.attr("selected", "");
              }

              nativeSelect.push(optionEl);
            });

            // 遍历所有 p-option 子元素
            const pOptions = this.all("p-option");
            pOptions.forEach((opt) => {
              const optionEl = $({
                tag: "option",
                text: opt.text,
              });
              optionEl.attr("value", opt.attr("value") || opt.text);

              if (opt.attr("disabled") !== null) {
                optionEl.attr("disabled", "");
              }

              if (opt.attr("selected") !== null) {
                optionEl.attr("selected", "");
              }

              nativeSelect.push(optionEl);
            });

            // 恢复之前选中的值
            if (prevValue) {
              nativeSelect.ele.value = prevValue;
            }

            // 同步最终的原生 value 到组件 value
            const nativeValue = nativeSelect.ele.value || null;
            if (nativeValue !== this.value) {
              this.value = nativeValue;
            }

            this._isSyncing = false;

            // 同步完成后根据 value 状态管理空选项
            if (this.value && this.hasEmptyOption) {
              const emptyOption = nativeSelect.$('[default-empty-option]');
              if (emptyOption) {
                emptyOption.remove();
                this.hasEmptyOption = false;
              }
            }

            // 值确实变化且非空时触发 change
            if (this.value !== prevValue && this.value !== null) {
              this.emit("change", {
                data: { value: this.value },
              });
            }
          },
        },
        ready() {
          // 监听 p-option-attached 事件
          this.on("p-option-attached", (e) => {
            e.stopPropagation();
            this.syncOptionsFromChildren();
          });
        },
        attached() {
          if (this.variant == "filled" && !this.$("[slot='label']")) {
            this.shadow
              .$("p-field-container")
              .style.setProperty("--field-container-padding-top", "0");
          }

          // 同步所有选项（原生 option 和 p-option）
          this.syncOptionsFromChildren();
        },
      };
    };
  </script>
</template>
