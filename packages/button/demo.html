<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Button Demo</title>
    <script
      src="https://cdn.jsdelivr.net/gh/ofajs/ofa.js/dist/ofa.min.mjs"
      type="module"
    ></script>
    <link rel="stylesheet" href="../css/theme.css" />
    <style>
      p-button {
        margin: 8px;
      }
    </style>
  </head>
  <body>
    <l-m src="./button.html"></l-m>
    <div>
      <p-button>Simple Button</p-button>
      <p-button variant="outlined">Outlined Button</p-button>
      <p-button variant="text">Text Button</p-button>
    </div>
    <div>
      <p-button>Default Size</p-button>
      <p-button size="s" style="width: 200px">Small Size</p-button>
      <p-button size="xs">Extra Small Size</p-button>
      <p-button size="l">Large Size</p-button>
      <p-button size="xl">Extra Large Size</p-button>
    </div>
  </body>
</html>
