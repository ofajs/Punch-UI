<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Button Demo</title>
    <script
      src="https://cdn.jsdelivr.net/gh/ofajs/ofa.js/dist/ofa.min.mjs"
      type="module"
    ></script>
    <link rel="stylesheet" href="../css/theme.css" />
    <style>
      p-button {
        margin: 8px;
      }
    </style>
  </head>
  <body>
    <l-m src="./button.html"></l-m>
    <div>
      <p-button>Simple Button</p-button>
      <p-button variant="outlined">Outlined Button</p-button>
      <p-button variant="text">Text Button</p-button>
    </div>
    <div>
      <p-button>Default Size</p-button>
      <p-button size="s" style="width: 200px">Small Size</p-button>
      <p-button size="xs">Extra Small Size</p-button>
      <p-button size="l">Large Size</p-button>
      <!-- <p-button size="xl">Extra Large Size</p-button> -->
    </div>
    <div>
      <p-button disabled>Disabled Button</p-button>
      <p-button variant="outlined" disabled>Disabled Outlined</p-button>
      <p-button variant="text" disabled>Disabled Text</p-button>
    </div>
    <div>
      <p-button>Default Color</p-button>
      <p-button color="primary">Primary</p-button>
      <p-button color="error">Error</p-button>
      <p-button color="success">Success</p-button>
      <p-button color="neutral">Neutral</p-button>
      <p-button variant="outlined">Default Color Outlined</p-button>
      <p-button variant="outlined" color="primary">Primary</p-button>
      <p-button variant="outlined" color="error">Error</p-button>
      <p-button variant="outlined" color="success">Success</p-button>
      <p-button variant="outlined" color="neutral">Neutral</p-button>
      <p-button variant="text">Default Color Text</p-button>
      <p-button variant="text" color="primary">Primary</p-button>
      <p-button variant="text" color="error">Error</p-button>
      <p-button variant="text" color="success">Success</p-button>
      <p-button variant="text" color="neutral">Neutral</p-button>
    </div>
    <div>
      <p-button icon>+</p-button>
      <p-button icon size="small">-</p-button>
      <p-button icon size="large">×</p-button>
    </div>
  </body>
</html>
