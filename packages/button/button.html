<template component>
  <l-m src="../ripple/ripple.html"></l-m>
  <style>
    :host {
      position: relative;
      display: inline-block;
      user-select: none;
      cursor: pointer;
    }

    .container {
      display: flex;
      align-items: center;
      justify-content: center;
      width: inherit;
      height: inherit;
      border-radius: 28px;
      height: 40px;
      font-size: 16px;
    }

    :host([size="xs"]) .container {
      height: 24px;
      font-size: 12px;
    }

    :host([size="s"]) .container,
    :host([size="small"]) .container {
      height: 32px;
      font-size: 14px;
    }

    :host([size="l"]) .container,
    :host([size="large"]) .container {
      height: 48px;
      font-size: 18px;
    }

    :host([size="xl"]) .container {
      height: 56px;
      font-size: 20px;
    }

    :host([disabled]) {
      cursor: not-allowed;
    }
    :host([disabled]) .container {
      opacity: 0.6;
      pointer-events: none;
    }

    :host([icon]) .container {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      padding: 0;
      border-radius: 50%;
    }
    :host([icon][size="xs"]) .container {
      width: 24px;
      height: 24px;
    }
    :host([icon][size="s"]) .container,
    :host([icon][size="small"]) .container {
      width: 32px;
      height: 32px;
    }
    :host([icon][size="l"]) .container,
    :host([icon][size="large"]) .container {
      width: 48px;
      height: 48px;
    }
    :host([icon][size="xl"]) .container {
      width: 56px;
      height: 56px;
    }

    .inner {
      padding: 0 1em;
    }
  </style>
  <div class="container">
    <p-stylization>
      <div class="inner"><slot></slot></div>
    </p-stylization>
    <p-ripple></p-ripple>
  </div>
  <script>
    export default async ({ load }) => {
      if (!customElements.get("p-stylization")) {
        // 加载风格化组件
        await load("../stylization/stylization.html");
      }

      return {
        tag: "p-button",
        attrs: {
          variant: null,
          size: null,
          disabled: null,
          color: null,
          icon: null,
        },
        watch: {
          variant(variant) {
            if (variant) {
              this.style.setProperty("--pui-variant", variant);
            } else {
              this.style.removeProperty("--pui-variant");
            }
          },
          color(color) {
            if (color) {
              this.style.setProperty("--pui-color", color);
            } else {
              this.style.removeProperty("--pui-color");
            }
          },
        },
      };
    };
  </script>
</template>
