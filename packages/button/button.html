<template component>
  <l-m src="../ripple/ripple.html"></l-m>
  <style>
    :host {
      position: relative;
      display: inline-block;
      user-select: none;
      cursor: pointer;
    }
    .container {
      display: flex;
      align-items: center;
      justify-content: center;
      width: inherit;
      height: inherit;
      border-radius: 20px;
      height: 40px;
      font-size: 16px;
    }

    .inner {
      padding: 0 1em;
    }
  </style>
  <p-size>
    <div class="container">
      <p-stylization>
        <div class="inner"><slot></slot></div>
      </p-stylization>
      <p-ripple></p-ripple>
    </div>
  </p-size>
  <script>
    export default async ({ load }) => {
      if (!customElements.get("p-stylization")) {
        // 加载风格化组件
        await load("../stylization/stylization.html");
      }
      await load("../size/size.html");

      return {
        tag: "p-button",
        attrs: {
          variant: null,
          size: null,
          disabled: null,
          iconOnly: false,
        },
        watch: {
          variant(variant) {
            if (variant) {
              this.style.setProperty("--variant", variant);
            } else {
              this.style.removeProperty("--variant");
            }
          },
          size(size) {
            if (size) {
              this.style.setProperty("--size", size);
            } else {
              this.style.removeProperty("--size");
            }
          },
        },
      };
    };
  </script>
</template>
