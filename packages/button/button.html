<template component>
  <l-m src="../ripple/ripple.html"></l-m>
  <style>
    :host {
      position: relative;
      display: inline-block;
      vertical-align: middle;
      user-select: none;
      cursor: pointer;
      height: 40px;
      border-radius: 28px;
      font-size: 16px;
    }

    :host([size="xs"]) {
      height: 24px;
      font-size: 12px;
    }

    :host([size="s"]),
    :host([size="small"]) {
      height: 32px;
      font-size: 14px;
    }

    :host([size="l"]),
    :host([size="large"]) {
      height: 48px;
      font-size: 18px;
    }

    :host([size="xl"]) {
      height: 56px;
      font-size: 20px;
    }

    :host([icon]) {
      width: 40px;
      height: 40px;
      padding: 0;
      border-radius: 50%;
    }
    :host([icon][size="xs"]) {
      width: 24px;
      height: 24px;
    }
    :host([icon][size="s"]),
    :host([icon][size="small"]) {
      width: 32px;
      height: 32px;
    }
    :host([icon][size="l"]),
    :host([icon][size="large"]) {
      width: 48px;
      height: 48px;
    }
    :host([icon][size="xl"]) {
      width: 56px;
      height: 56px;
    }

    :host([disabled]) {
      cursor: not-allowed;
    }
    :host([disabled]) p-stylization {
      opacity: 0.6;
      pointer-events: none;
    }

    slot {
      display: block;
    }

    .inner {
      padding: 0 1em;
      display: flex;
      align-items: center;
      gap: 8px;
    }
  </style>
  <style>
    @media (hover: hover) {
      p-stylization:not([disabled]):hover::before {
        content: "";
        position: absolute;
        inset: 0;
        background-color: rgb(from var(--main-color-container) r g b / 0.1);
        border-radius: inherit;
        pointer-events: none;
      }
    }

    p-stylization {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: inherit;
      width: 100%;
      height: 100%;
      --pui-ripple-color: rgb(from var(--main-color-container) r g b / 0.3);
    }

    p-stylization:focus {
      outline: none;
    }

    p-stylization:focus-visible {
      outline: 2px solid var(--main-color);
      outline-offset: 2px;
    }

    .inner {
      padding: 0 1em;
      display: flex;
      align-items: center;
      gap: 8px;
    }
  </style>
  <p-stylization
    tabindex="0"
    on:keydown="handleKeydown"
    attr:variant="variant || 'filled'"
    :color="color"
  >
    <div class="inner">
      <slot name="prefix"></slot><slot></slot><slot name="suffix"></slot>
    </div>
    <p-ripple></p-ripple>
  </p-stylization>
  <script>
    export default async ({ load }) => {
      if (!customElements.get("p-stylization")) {
        // 加载风格化组件
        await load("../stylization/stylization.html");
      }

      return {
        tag: "p-button",
        attrs: {
          variant: null,
          size: null,
          disabled: null,
          color: "primary",
          icon: null,
          autofocus: null,
        },
        watch: {
          autofocus(val) {
            if (val !== null) {
              requestAnimationFrame(() => {
                this.shadow.$("p-stylization").ele.focus();
              });
            }
          },
        },
        proto: {
          handleKeydown(e) {
            if (this.disabled !== null) {
              return;
            }
            if (e.code === "Space" || e.code === "Enter") {
              e.preventDefault();
              this.ele.click();

              const ripple = this.shadow.$("p-ripple");
              const styl = this.shadow.$("p-stylization");
              const rect = styl.ele.getBoundingClientRect();
              const centerX = rect.width / 2;
              const centerY = rect.height / 2;
              ripple.createRipple(centerX, centerY);

              setTimeout(() => {
                ripple.cancelRipple();
              }, 100);
            }
          },
          focus() {
            this.shadow.$("p-stylization").ele.focus();
          },
          blur() {
            this.shadow.$("p-stylization").ele.blur();
          },
        },
      };
    };
  </script>
</template>
