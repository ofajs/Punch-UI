<template component>
  <l-m src="../ripple/ripple.html"></l-m>
  <style>
    :host {
      position: relative;
      display: inline-block;
      user-select: none;
      cursor: pointer;
    }

    .container {
      display: flex;
      align-items: center;
      justify-content: center;
      width: inherit;
      height: inherit;
      border-radius: 28px;
      height: 40px;
      font-size: 16px;
      --pui-ripple-color: rgb(from var(--md-sys-color-primary) r g b / 0.3);
    }

    :host([size="xs"]) .container {
      height: 24px;
      font-size: 12px;
    }

    :host([size="s"]) .container,
    :host([size="small"]) .container {
      height: 32px;
      font-size: 14px;
    }

    :host([size="l"]) .container,
    :host([size="large"]) .container {
      height: 48px;
      font-size: 18px;
    }

    :host([size="xl"]) .container {
      height: 56px;
      font-size: 20px;
    }

    :host([disabled]) {
      cursor: not-allowed;
    }
    :host([disabled]) .container {
      opacity: 0.6;
      pointer-events: none;
    }

    .container:focus {
      outline: none;
    }

    .container:focus-visible {
      outline: 2px solid var(--md-sys-color-primary);
      outline-offset: 2px;
    }

    @media (hover: hover) {
      .container:hover {
        filter: brightness(0.95);
      }
    }

    :host([icon]) .container {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      padding: 0;
      border-radius: 50%;
    }
    :host([icon][size="xs"]) .container {
      width: 24px;
      height: 24px;
    }
    :host([icon][size="s"]) .container,
    :host([icon][size="small"]) .container {
      width: 32px;
      height: 32px;
    }
    :host([icon][size="l"]) .container,
    :host([icon][size="large"]) .container {
      width: 48px;
      height: 48px;
    }
    :host([icon][size="xl"]) .container {
      width: 56px;
      height: 56px;
    }

    .inner {
      padding: 0 1em;
    }
  </style>
  <div class="container" tabindex="0" on:keydown="handleKeydown">
    <p-stylization>
      <div class="inner"><slot></slot></div>
    </p-stylization>
    <p-ripple></p-ripple>
  </div>
  <script>
    export default async ({ load }) => {
      if (!customElements.get("p-stylization")) {
        // 加载风格化组件
        await load("../stylization/stylization.html");
      }

      return {
        tag: "p-button",
        attrs: {
          variant: null,
          size: null,
          disabled: null,
          color: null,
          icon: null,
          autofocus: null,
        },
        watch: {
          autofocus(val) {
            if (val !== null) {
              requestAnimationFrame(() => {
                this.shadow.$(".container").ele.focus();
              });
            }
          },
          variant(variant) {
            if (variant) {
              this.style.setProperty("--pui-variant", variant);
            } else {
              this.style.removeProperty("--pui-variant");
            }
          },
          color(color) {
            if (color) {
              this.style.setProperty("--pui-color", color);
              this.shadow
                .$(".container")
                .style.setProperty(
                  "--pui-ripple-color",
                  `rgb(from var(--md-sys-color-${color}) r g b / 0.3)`,
                );
            } else {
              this.style.removeProperty("--pui-color");
              this.shadow
                .$(".container")
                .style.removeProperty("--pui-ripple-color");
            }
          },
        },
        proto: {
          handleKeydown(e) {
            if (e.code === "Space" || e.code === "Enter") {
              e.preventDefault();
              this.ele.click();

              const ripple = this.shadow.$("p-ripple");
              const container = this.shadow.$(".container");
              const rect = container.ele.getBoundingClientRect();
              const centerX = rect.width / 2;
              const centerY = rect.height / 2;
              ripple.createRipple(centerX, centerY);
            }
          },
          focus() {
            this.shadow.$(".container").ele.focus();
          },
          blur() {
            this.shadow.$(".container").ele.blur();
          },
        },
      };
    };
  </script>
</template>
