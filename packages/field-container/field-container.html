<template component>
  <style>
    :host {
      display: block;
      border-radius: 8px;
      height: 40px;
    }

    :host([size="xs"]) {
      height: 24px;
    }

    :host([size="s"]),
    :host([size="small"]) {
      height: 32px;
    }

    :host([size="l"]),
    :host([size="large"]) {
      height: 48px;
    }

    :host([size="xl"]) {
      height: 56px;
    }

    ::slotted([slot="label"]) {
      padding: 0 8px;
    }

    .container {
      position: relative;
      display: flex;
      width: 100%;
      height: 100%;
      border-radius: inherit;
      transition: all ease 0.2s;
    }

    .wrapper {
      flex: 1;
      position: relative;
      height: 100%;
      display: flex;
      align-items: center;
    }

    .content {
      display: flex;
      width: 100%;
      height: 100%;
      padding: 0 8px;
    }

    .prefix,
    .suffix {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100%;
      color: var(--md-sys-color-neutral);
      background-color: transparent;
    }
    .label {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      /* padding: 0 8px; */
      border-radius: 4px;
      height: 100%;
      font-size: 16px;
      position: absolute;
      /* color: var(--md-sys-color-neutral); */
      background-color: transparent;
      transition: all ease 0.2s;
      pointer-events: none;
    }

    :host([focus]) .container {
      box-shadow: 0 0 0 2px var(--focus-stylization-color);
    }

    :host([focus]) .label {
      height: 16px;
      left: 0;
      top: -8px;
      font-size: 12px;
      background-color: var(--md-sys-color-surface);
    }
    :host(:not([focus])) .label {
      color: var(--md-sys-color-neutral);
    }

    :host([disabled]) .container {
      opacity: 0.5;
    }

    :host([variant="filled"]) {
      background-color: var(--md-sys-color-surface);
    }
  </style>
  <div class="container">
    <x-if :value="variant === 'filled'">
      <p-stylization :color="'neutral'" :variant="'filled'">
        <div class="content">
          <div class="prefix">
            <slot name="prefix"></slot>
          </div>
          <div class="wrapper">
            <slot></slot>
            <div class="label" part="label">
              <slot name="label"></slot>
            </div>
          </div>
          <div class="suffix">
            <slot name="suffix"></slot>
          </div>
        </div>
      </p-stylization>
    </x-if>
    <x-else>
      <p-stylization :color="color" :variant="'outlined'">
        <div class="content">
          <div class="prefix">
            <slot name="prefix"></slot>
          </div>
          <div class="wrapper">
            <slot></slot>
            <div class="label" part="label">
              <slot name="label"></slot>
            </div>
          </div>
          <div class="suffix">
            <slot name="suffix"></slot>
          </div>
        </div>
      </p-stylization>
    </x-else>
  </div>
  <script>
    export default async ({ load }) => {
      if (!customElements.get("p-stylization")) {
        await load("../stylization/stylization.html");
      }

      return {
        tag: "p-field-container",
        attrs: {
          variant: null,
          color: null,
          size: null,
        },
        watch: {
          color(color) {
            this.style.setProperty(
              "--focus-stylization-color",
              `var(--md-sys-color-${color || "primary"})`,
            );
          },
        },
      };
    };
  </script>
</template>
