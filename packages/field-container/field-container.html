<template component>
  <style>
    :host {
      display: block;
      border-radius: 8px;
      height: 40px;
    }

    :host([size="xs"]) {
      height: 24px;
    }

    :host([size="s"]),
    :host([size="small"]) {
      height: 32px;
    }

    :host([size="l"]),
    :host([size="large"]) {
      height: 48px;
    }

    :host([size="xl"]) {
      height: 56px;
    }

    ::slotted([slot="label"]) {
      padding: 0 8px;
    }

    p-stylization {
      position: relative;
      display: flex;
      width: 100%;
      height: 100%;
      border-radius: inherit;
      transition: all ease 0.2s;
    }

    .wrapper {
      flex: 1;
      position: relative;
      height: 100%;
      display: flex;
      align-items: center;
    }

    .content {
      display: flex;
      width: 100%;
      height: 100%;
      padding: 0 8px;
    }

    .prefix,
    .suffix {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100%;
      color: var(--neutral-color);
      background-color: transparent;
    }
    .label {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      height: 100%;
      font-size: 16px;
      position: absolute;
      background-color: transparent;
      transition: all ease 0.2s;
      pointer-events: none;
    }

    :host([focus]) p-stylization {
      box-shadow: 0 0 0 2px var(--focus-stylization-color);
    }

    :host([focus]) .label,
    :host([hang-label]) .label {
      height: 16px;
      left: 0;
      top: -8px;
      font-size: 12px;
      background-color: var(--md-sys-color-surface);
    }
    :host(:not([focus]):not([hang-label])) .label {
      color: var(--neutral-color);
    }

    :host([disabled]) p-stylization {
      opacity: 0.5;
    }

    .bottom-line {
      display: none;
    }

    :host([variant="filled"]) .bottom-line {
      display: block;
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 1px;
      background-color: var(--neutral-color);
    }

    :host([variant="filled"][focus]) .bottom-line {
      height: 2px;
      background-color: var(--focus-stylization-color);
    }
  </style>
  <link rel="stylesheet" href="./field-container.css" />
  <p-stylization
    attr:variant="variant === 'filled' ? 'tonal' : 'outlined'"
    :color="variant === 'filled' ? 'neutral' : color"
  >
    <div class="content">
      <div class="prefix">
        <slot name="prefix"></slot>
      </div>
      <div class="wrapper" part="wrapper">
        <slot></slot>
        <div class="label" part="label">
          <slot name="label"></slot>
        </div>
      </div>
      <div class="suffix">
        <slot name="suffix"></slot>
      </div>
    </div>
    <div class="bottom-line"></div>
  </p-stylization>
  <script>
    export default async ({ load }) => {
      if (!customElements.get("p-stylization")) {
        await load("../stylization/stylization.html");
      }

      return {
        tag: "p-field-container",
        attrs: {
          variant: "outlined",
          color: null,
          size: null,
        },
        watch: {
          color(color) {
            this.style.setProperty(
              "--focus-stylization-color",
              `var(--md-sys-color-${color || "primary"})`,
            );
          },
        },
      };
    };
  </script>
</template>
