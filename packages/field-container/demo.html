<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Field Container Demo</title>
    <script
      src="https://cdn.jsdelivr.net/gh/ofajs/ofa.js/dist/ofa.min.mjs"
      type="module"
    ></script>
    <link rel="stylesheet" href="../css/theme.css" />
    <style>
      body {
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          Segoe UI,
          Microsoft Yahei,
          Helvetica,
          Arial,
          sans-serif,
          Apple Color Emoji,
          Segoe UI Emoji;
        padding: 20px;
      }

      p-field-container {
        display: inline-block;
        width: 200px;
        margin: 16px;
      }

      .demo-section {
        margin-bottom: 32px;
      }

      .demo-section h3 {
        margin-bottom: 16px;
        color: #333;
      }
    </style>
  </head>
  <body>
    <h2>Field Container</h2>
    <l-m src="./field-container.html"></l-m>

    <div class="demo-section">
      <h3>Basic Usage</h3>
      <p-field-container>
        <span slot="label">Username</span>
      </p-field-container>
    </div>

    <div class="demo-section">
      <h3>Focus State Usage</h3>
      <p-field-container focus>
        <span slot="label">Username</span>
      </p-field-container>
    </div>

    <div class="demo-section">
      <h3>With Prefix</h3>
      <p-field-container>
        <span slot="prefix">+86</span>
        <span slot="label">Phone Number</span>
      </p-field-container>
    </div>

    <div class="demo-section">
      <h3>With Suffix</h3>
      <p-field-container>
        <span slot="label">Website</span>
        <span slot="suffix">.com</span>
      </p-field-container>
    </div>

    <div class="demo-section">
      <h3>Disabled State</h3>
      <p-field-container disabled>
        <span slot="label">Disabled Input</span>
      </p-field-container>
    </div>

    <div class="demo-section">
      <h3>Error State</h3>
      <p-field-container color="error">
        <span slot="label">Required Field</span>
      </p-field-container>
    </div>

    <div class="demo-section">
      <h3>Size Variants</h3>
      <p-field-container size="xs" focus>
        <span slot="label">Extra Small (xs)</span>
      </p-field-container>
      <p-field-container size="s">
        <span slot="label">Small (s)</span>
      </p-field-container>
      <p-field-container>
        <span slot="label">Default</span>
      </p-field-container>
      <p-field-container size="l">
        <span slot="label">Large (l)</span>
      </p-field-container>
      <p-field-container size="xl" focus>
        <span slot="label">Extra Large (xl)</span>
      </p-field-container>
    </div>
  </body>
</html>
