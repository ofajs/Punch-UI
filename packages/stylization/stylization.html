<template component>
  <style>
    :host,
    .container {
      display: inherit;
      justify-content: inherit;
      align-items: inherit;
      width: inherit;
      height: inherit;
      border-radius: inherit;
      transition: all 0.3s ease-in-out;
    }
  </style>

  <slot></slot>
  <script>
    export default async () => {
      return {
        tag: "p-stylization",
        data: {
          variant: null,
          color: null,
        },
        watch: {
          ["variant,color"]([variant, color], e) {
            if (!variant) {
              variant = "filled";
            }
            if (!color) {
              color = "primary";
            }

            switch (variant) {
              case "outlined":
                Object.assign(this.style, {
                  color: `var(--md-sys-color-${color})`,
                  border: `var(--md-sys-color-${color}) solid 1px`,
                  backgroundColor: "transparent",
                });
                break;
              case "text":
                Object.assign(this.style, {
                  color: `var(--md-sys-color-${color})`,
                  backgroundColor: "transparent",
                  border: "transparent solid 1px",
                });
                break;
              case "filled":
              default:
                Object.assign(this.style, {
                  color: `var(--md-sys-color-on-${color})`,
                  backgroundColor: `var(--md-sys-color-${color})`,
                  border: "transparent solid 1px",
                });
                break;
            }
          },
        },
      };
    };
  </script>
</template>
