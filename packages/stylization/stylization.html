<template component>
  <style>
    :host,
    .container {
      display: inherit;
      justify-content: inherit;
      align-items: inherit;
      width: inherit;
      height: inherit;
      border-radius: inherit;
    }
  </style>

  <slot></slot>
  <script>
    export default async () => {
      return {
        tag: "p-stylization",
        data: {
          variant: null,
          color: null,
        },
        watch: {
          ["variant,color"]([variant, color], e) {
            if (!variant) {
              variant = "filled";
            }
            if (!color) {
              color = "primary";
            }

            switch (variant) {
              case "outlined":
                // 外边框样式
                Object.assign(this.style, {
                  color: `var(--md-sys-color-${color})`,
                  border: `var(--md-sys-color-${color}) solid 1px`,
                  backgroundColor: "",
                });
                break;
              case "text":
                // 文本样式
                Object.assign(this.style, {
                  color: `var(--md-sys-color-${color})`,
                  backgroundColor: "",
                  border: "",
                });
                break;
              case "filled":
              default:
                // 默认样式
                Object.assign(this.style, {
                  color: `var(--md-sys-color-on-${color})`,
                  backgroundColor: `var(--md-sys-color-${color})`,
                  border: "",
                });
                break;
            }
          },
        },
      };
    };
  </script>
</template>
