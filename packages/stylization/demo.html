<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stylization Demo</title>
    <script
      src="https://cdn.jsdelivr.net/gh/ofajs/ofa.js/dist/ofa.min.mjs"
      type="module"
    ></script>
    <link rel="stylesheet" href="../css/pui-global.css" />
    <style>
      .demo-container {
        display: inline-flex;
        justify-content: center;
        align-items: center;
        width: 160px;
        height: 40px;
        border-radius: 14px;
        margin-top: 4px;
      }
    </style>
  </head>
  <body>
    <l-m src="./stylization.html"></l-m>
    <div class="demo-container">
      <p-stylization>Filled (Default)</p-stylization>
    </div>
    <div class="demo-container" style="--variant: tonal">
      <p-stylization variant="tonal">Tonal</p-stylization>
    </div>
    <div class="demo-container" style="--variant: outlined">
      <p-stylization variant="outlined">Outlined</p-stylization>
    </div>
    <div class="demo-container" style="--variant: text">
      <p-stylization variant="text">Text</p-stylization>
    </div>
  </body>
</html>
