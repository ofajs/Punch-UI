<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Size Demo</title>
    <script
      src="https://cdn.jsdelivr.net/gh/ofajs/ofa.js/dist/ofa.min.mjs"
      type="module"
    ></script>
    <link rel="stylesheet" href="../css/theme.css" />
    <style>
      .container {
        margin-top: 16px;
      }
      .demo-main {
        display: inline-flex;
        justify-content: center;
        align-items: center;
        width: 160px;
        height: 40px;
        border-radius: 14px;
        background-color: var(--md-sys-color-primary);
        color: var(--md-sys-color-on-primary);
      }
    </style>
  </head>
  <body>
    <l-m src="./size.html"></l-m>

    <div class="container">
      <p-size>
        <div class="demo-main">Default Size</div>
      </p-size>
    </div>

    <div class="container">
      <p-size size="s">
        <div class="demo-main">Small Size</div>
      </p-size>
    </div>

    <div class="container">
      <p-size size="xs">
        <div class="demo-main">Extra Small Size</div>
      </p-size>
    </div>

    <div class="container">
      <p-size size="l">
        <div class="demo-main">Large Size</div>
      </p-size>
    </div>

    <div class="container">
      <p-size size="xl">
        <div class="demo-main">Extra Large Size</div>
      </p-size>
    </div>
  </body>
</html>
