<template component>
  <style>
    :host {
      display: block;
    }
    .size-container {
      transform-origin: 0 0;
    }
  </style>
  <div class="size-container">
    <slot></slot>
  </div>
  <script>
    export default async ({ load }) => {
      return {
        tag: "p-size",
        attrs: {
          size: null,
        },
        watch: {
          size(size) {
            // 根据尺寸进行缩放
            switch (size) {
              case "s":
              case "small":
                this.shadow.$(".size-container").style.transform = "scale(0.8)";
                break;
              case "xs":
              case "extra-small":
                this.shadow.$(".size-container").style.transform = "scale(0.6)";
                break;
              case "l":
              case "large":
                this.shadow.$(".size-container").style.transform = "scale(1.2)";
                break;
              case "xl":
              case "extra-large":
                this.shadow.$(".size-container").style.transform = "scale(1.4)";
                break;
            }
          },
        },
      };
    };
  </script>
</template>
