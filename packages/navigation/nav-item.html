<template component>
  <l-m src="../ripple/ripple.html"></l-m>
  <style>
    :host {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 1;
    }

    .container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 12px;
    }

    .icon {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 32px;
      font-size: 24px;
    }

    .icon-hover-bg {
      position: absolute;
      z-index: 0;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-hover-bg-inner {
      z-index: 0;
      width: 0;
      height: 100%;
      border-radius: 24px;
      opacity: 0;
      background-color: rgb(
        from var(--md-sys-color-primary-container) r g b / 0.3
      );
      transition: all 0.2s ease;
    }

    :host(:hover) .icon-hover-bg-inner {
      width: 100%;
      opacity: 1;
    }

    .label {
      font-size: 14px;
      margin-top: 4px;
    }

    :host([disabled]) {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .icon-container {
      z-index: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    p-ripple {
      border-radius: 24px;
    }

    /* :host([active]) {
      font-weight: bold;
    } */
  </style>
  <match-var label-parallel="true">
    <style>
      .container {
        flex-direction: row;
        padding: 4px 12px;
      }
      .icon {
        width: 36px;
      }
      .icon-hover-bg {
        display: none;
      }
      .label {
        margin-top: 0;
      }

      .container-hover-bg {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
      }
    </style>
  </match-var>
  <div class="container" on:click="handleClick">
    <div class="container-hover-bg">
      <div class="icon-hover-bg-inner"></div>
    </div>
    <div class="icon">
      <div class="icon-hover-bg">
        <div class="icon-hover-bg-inner"></div>
      </div>
      <span class="icon-container">
        <slot name="icon"></slot>
      </span>
    </div>
    <div class="label">
      <slot></slot>
    </div>
    <p-ripple attr:disabled="disabled"></p-ripple>
  </div>
  <script>
    import "../common/init.js";

    export default async ({ load }) => {
      if (!customElements.get("p-stylization")) {
        // 加载风格化组件
        await load("../stylization/stylization.html");
      }

      return {
        tag: "p-nav-item",
        data: {},
        attrs: {
          disabled: null,
          active: null,
        },
        watch: {
          active() {
            if (this.active === null) {
              return;
            }

            this.emit("change-active");
          },
        },
        proto: {
          handleClick(e) {
            if (this.disabled !== null) {
              e.stopPropagation();
              return;
            }
          },
        },
      };
    };
  </script>
</template>
