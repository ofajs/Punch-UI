<template component>
  <style>
    :host {
      position: absolute;
      z-index: 2;
      display: block;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      -webkit-tap-highlight-color: transparent;
      tap-highlight-color: transparent;
      overflow: hidden;
      border-radius: inherit;
    }
    .container {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      tap-highlight-color: transparent;
    }
    .ripple {
      position: absolute;
      width: 0;
      height: 0;
      background-color: var(--pui-ripple-color, rgba(223, 223, 223, 0.3));
      transition:
        all ease-out 0.7s,
        opacity ease 1s;
      border-radius: 50%;
      pointer-events: none;
      will-change: transform, opacity, width, height;
    }
  </style>
  <div
    class="container"
    on:mousedown="handleStart"
    on:mouseup="cancelRipple"
    on:mouseleave="cancelRipple"
    on:touchstart="handleStart"
    on:touchend="cancelRipple"
    on:touchcancel="cancelRipple"
  ></div>
  <script>
    export default {
      tag: "p-ripple",
      attrs: {
        disabled: null,
        duration: "500",
        color: null,
      },
      proto: {
        cancelRipple() {
          const $target = this.shadow.$(".ripple:not(.pass)");
          if ($target) {
            $target.classList.add("pass");
            $target.css.opacity = 0;
            setTimeout(
              () => {
                $target.remove();
              },
              parseInt(this.duration) || 700,
            );
          }
        },

        handleStart(e) {
          if (this.disabled !== null) {
            return;
          }

          if ("ontouchstart" in window && e.type.includes("mouse")) {
            return;
          }

          const event = e.type.startsWith("touch") ? e.touches[0] : e;
          const container = this.shadow.$(".container");
          const rect = container.ele.getBoundingClientRect();

          const offsetX = event.clientX - rect.left;
          const offsetY = event.clientY - rect.top;

          this.createRipple(container, offsetX, offsetY);
        },

        createRipple(container, offsetX, offsetY) {
          const rippleEl = $(`<div class="ripple"></div>`);
          container.push(rippleEl);

          if (this.color) {
            rippleEl.css.backgroundColor = this.color;
          }

          const radius = $(this.ele.offsetParent).css.borderRadius;
          container.css.borderRadius = radius;

          // 设置初始位置
          Object.assign(rippleEl.css, {
            left: offsetX + "px",
            top: offsetY + "px",
          });

          const { clientWidth, clientHeight } = container.ele;

          requestAnimationFrame(() => {
            const maxSize =
              Math.sqrt(clientWidth ** 2 + clientHeight ** 2) * 2 * 1.2;
            const left = offsetX - maxSize / 2;
            const top = offsetY - maxSize / 2;

            Object.assign(rippleEl.css, {
              left: left + "px",
              top: top + "px",
              width: maxSize + "px",
              height: maxSize + "px",
              transitionDuration: `${parseInt(this.duration) || 700}ms`,
            });
          });
        },
      },
      ready() {
        this.on("click", (e) => {
          if (this.host && this.host.length === 1 && this.host[0].tag === "a") {
            e.stopPropagation();
            this.host[0].ele.click();
          }
        });
      },
    };
  </script>
</template>
