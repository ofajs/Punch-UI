<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ripple Component Demo</title>

    <script
      src="https://cdn.jsdelivr.net/gh/ofajs/ofa.js/dist/ofa.min.mjs"
      type="module"
    ></script>
    <link rel="stylesheet" href="../css/pui-global.css" />
    <style>
      .block {
        position: relative;
        margin: 80px 0 0 80px;
        width: 200px;
        height: 200px;
        border: #aaa solid 1px;
      }
    </style>
  </head>
  <body>
    <l-m src="./ripple.html"></l-m>
    <div class="block" style="background-color: #fb4747">
      <p-ripple></p-ripple>
      in text
    </div>
    <div class="block" style="background-color: #fb4747; border-radius: 60px">
      <p-ripple></p-ripple>
      in text 2
    </div>
    <div class="block" style="background-color: blue">
      <p-ripple></p-ripple>
      in text 3
    </div>
  </body>
</html>
