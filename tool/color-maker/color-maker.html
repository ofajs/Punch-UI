<template page>
  <style>
    :host {
      display: block;
      height: 100%;
    }
  </style>
  <link rel="stylesheet" href="./color-maker.css" />
  <link rel="stylesheet" href="./hljs.css" />

  <style id="paletteStyle"></style>
  <style id="themeStyle"></style>

  <div class="container">
    <section class="custom-color-section">
      <h3>添加自定义颜色</h3>
      <div class="custom-color-form">
        <div class="custom-color-input-group">
          <input
            type="color"
            :value="newColorValue"
            on:input="newColorValue = $event.target.value"
          />
          <input
            type="text"
            placeholder="颜色名称"
            :value="newColorName"
            on:input="newColorName = $event.target.value"
          />
          <button on:click="addCustomColor">添加</button>
        </div>
        <o-fill :value="customColors">
          <div class="custom-color-item">
            <div
              class="custom-color-preview"
              :style.background="$data.color"
            ></div>
            <span>{{$data.name}}</span>
            <span class="custom-color-hex">{{$data.color}}</span>
            <button
              class="delete-btn"
              on:click="$host.deleteCustomColor($data)"
            >
              ×
            </button>
          </div>
        </o-fill>
      </div>
    </section>

    <section class="color-section">
      <h3>色盘颜色预览</h3>
      <o-fill :value="colors">
        <div
          class="color-group"
          :style.border-color="$data.pick"
          role="group"
          attr:aria-label="$data.name + ' color group'"
        >
          <div class="color-name" :style.color="$data.pick">{{$data.name}}</div>
          <o-fill :value="$data.colors">
            <div
              class="color-block"
              :style.background="'var(' + $data.cssVar + ')'"
              :style.color="$host.getBlockColor($data.point)"
              on:click="$host.copyCssVar($data)"
              on:keydown="$host.handleKeydown($event, $data)"
              role="button"
              tabindex="0"
              :aria-label="'Copy CSS variable: ' + $data.cssVar"
            >
              <o-if :value="$data.copySuccess">
                <div aria-live="polite">Copied</div>
              </o-if>
              <o-else> {{$data.point}} </o-else>
            </div>
          </o-fill>
        </div>
      </o-fill>
    </section>

    <section class="color-section">
      <h3>主题颜色预览</h3>
      <o-fill :value="themes">
        <div
          attr:class="`${$data.class} theme-container`"
          role="region"
          attr:aria-label="$data.theme + ' Theme'"
        >
          <div class="theme-name">{{$data.theme}}</div>
          <div class="theme-color-container">
            <o-fill :value="$data.groups">
              <div class="theme-color-group">
                <o-fill :value="$data.blocks">
                  <div
                    class="theme-color-block"
                    :style.background="'var(' + $data.cssVar + ')'"
                    :style.color="$host.getBlockColor($data.point)"
                    on:click="$host.copyCssVar($data)"
                    on:keydown="$host.handleKeydown($event, $data)"
                    role="button"
                    tabindex="0"
                    :aria-label="'Copy CSS variable: ' + $data.cssVar"
                  >
                    <o-if :value="$data.copySuccess">
                      <div class="theme-color-css-var" aria-live="polite">
                        Copied
                      </div>
                    </o-if>
                    <o-else>
                      <div class="theme-color-name">{{$data.name}}</div>
                      <div class="theme-color-css-var">{{$data.cssVar}}</div>
                    </o-else>
                  </div>
                </o-fill>
              </div>
            </o-fill>
          </div>
          <div style="display: flex">
            <div
              class="theme-color-block"
              :style.background="'var(' + $data.surface.cssVar + ')'"
              :style.color="$host.getBlockColor($data.surface.point)"
              on:click="$host.copyCssVar($data.surface)"
              on:keydown="$host.handleKeydown($event, $data.surface)"
              role="button"
              tabindex="0"
              :aria-label="'Copy CSS variable: ' + $data.surface.cssVar"
            >
              <o-if :value="$data.surface.copySuccess">
                <div class="theme-color-css-var" aria-live="polite">Copied</div>
              </o-if>
              <o-else>
                <div class="theme-color-name">Surface</div>
                <div class="theme-color-css-var">{{$data.surface.cssVar}}</div>
              </o-else>
            </div>
            <div
              class="theme-color-block"
              :style.background="'var(' + $data.onSurface.cssVar + ')'"
              :style.color="$host.getBlockColor($data.onSurface.point)"
              on:click="$host.copyCssVar($data.onSurface)"
              on:keydown="$host.handleKeydown($event, $data.onSurface)"
              role="button"
              tabindex="0"
              :aria-label="'Copy CSS variable: ' + $data.onSurface.cssVar"
            >
              <o-if :value="$data.onSurface.copySuccess">
                <div class="theme-color-css-var" aria-live="polite">Copied</div>
              </o-if>
              <o-else>
                <div class="theme-color-name">On Surface</div>
                <div class="theme-color-css-var">
                  {{$data.onSurface.cssVar}}
                </div>
              </o-else>
            </div>
          </div>
        </div>
      </o-fill>
    </section>

    <div class="style-output">
      <section>
        <h3>色盘样式</h3>
        <pre><code class="hljs language-css" id="palette-content">{{paletteContent}}</code></pre>
      </section>
      <section>
        <h3>主题样式</h3>
        <pre><code class="hljs language-css" id="theme-content">{{themeContent}}</code></pre>
      </section>
      <section>
        <h3>全局样式</h3>
        <pre><code class="hljs language-css" id="global-content">{{globalContent}}</code></pre>
      </section>
    </div>
  </div>

  <script>
    import hljs from "https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.11.1/build/es/highlight.min.js";

    export default async ({ load }) => {
      const { generatePalette, generateTheme } = await load("./util.js");

      return {
        tag: "p-color-maker",
        data: {
          paletteContent: "",
          themeContent: "",
          globalContent: "",
          colors: [],
          themes: [],
          baseColors: [
            { name: "primary", color: "#1a7bd1" },
            { name: "success", color: "#6b9e52" },
            { name: "error", color: "#fb4747" },
            { name: "neutral", color: "#808080" },
          ],
          customColors: [],
          newColorName: "",
          newColorValue:
            "#" +
            Math.floor(Math.random() * 16777215)
              .toString(16)
              .padStart(6, "0"),
        },
        proto: {
          generatePalette() {
            const allColors = [...this.baseColors, ...this.customColors];
            const paletteResult = generatePalette(allColors);
            const themeResult = generateTheme(
              paletteResult.colorMaps,
              allColors,
            );

            this.colors = paletteResult.colors;
            this.themes = themeResult.themes;

            this.shadow.$("#paletteStyle").text = paletteResult.paletteContent;
            this.shadow.$("#themeStyle").text = themeResult.themeContent;

            let all = "";
            all += paletteResult.paletteContent;
            all += themeResult.themeContent;
            all += themeResult.globalContent;
            $("head").push(`<style>${all}</style>`);

            this.shadow.$("#palette-content").text =
              paletteResult.paletteContent;
            this.shadow.$("#theme-content").text = themeResult.themeContent;
            this.shadow.$("#global-content").text = themeResult.globalContent;

            this.shadow.all("code").forEach((block) => {
              hljs.highlightElement(block.ele);
            });
          },

          copyCssVar(data) {
            if (navigator.clipboard && data?.cssVar) {
              navigator.clipboard
                .writeText(data.cssVar)
                .then(() => {
                  data.copySuccess = true;
                  setTimeout(() => {
                    data.copySuccess = false;
                  }, 500);
                })
                .catch((err) => {
                  console.error("Failed to copy CSS variable:", err);
                });
            }
          },

          handleKeydown(event, data) {
            if (event.key === "Enter" || event.key === " ") {
              event.preventDefault();
              this.copyCssVar(data);
            }
          },

          getBlockColor(point) {
            return point > 50 ? "#000000" : "#ffffff";
          },

          loadCustomColors() {
            try {
              const saved = localStorage.getItem("p-color-maker-custom-colors");
              if (saved) {
                this.customColors = JSON.parse(saved);
              }
            } catch (e) {
              console.error("Failed to load custom colors:", e);
            }
          },

          saveCustomColors() {
            try {
              localStorage.setItem(
                "p-color-maker-custom-colors",
                JSON.stringify(this.customColors),
              );
            } catch (e) {
              console.error("Failed to save custom colors:", e);
            }
          },

          addCustomColor() {
            const name = this.newColorName.trim();
            const color = this.newColorValue;
            if (!name) return;

            const exists = this.customColors.some((c) => c.name === name);
            if (exists) return;

            this.customColors.push({ name, color });
            this.saveCustomColors();
            this.newColorName = "";
            this.generatePalette();
          },

          deleteCustomColor(data) {
            const idx = this.customColors.findIndex(
              (c) => c.name === data.name && c.color === data.color,
            );
            if (idx !== -1) {
              this.customColors.splice(idx, 1);
              this.saveCustomColors();
              this.generatePalette();
            }
          },
        },
        attached() {
          this.loadCustomColors();
          this.generatePalette();
        },
      };
    };
  </script>
</template>
